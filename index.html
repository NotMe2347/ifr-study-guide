["VID","IR.VI.D.K1","appr","The approach plate says 'Circling NA at night' east of runway 2. What does that mean?",
 "Circling maneuvers are not authorized in that area/sector (here, at night), usually because of obstacles or unlit terrain. You must circle only in the permitted area or not at all.",
 "TPP legend; Instrument Procedures Handbook",[]],
// ===== VI.E Landing =====
["VIE","IR.VI.E.K1","appr","You break out at the MDA but the flight visibility looks like 1/2 mile and the approach requires 1. Can you land?",
 "No. You can't descend below the MDA or land unless flight visibility is at least the visibility prescribed in the approach. Flight visibility is the pilot's determination, not the reported visibility.",
 "14 CFR 91.175(c)(2), (d)",[]],
["VIE","IR.VI.E.K2","charts","Describe the approach lighting systems and the PAPI indications.",
 "ALS types include ALSF-1/2, MALSR, MALSF, SSALR, ODALS, REIL. PAPI: 4 lights: 2 white 2 red on path, more white = high, more red = low, 4 red = well below glide path. VASI: red over white = on path.",
 "AIM 2-1-1, 2-1-2 (Approach lights, VGSI)",[]],
["VIE","IR.VI.E.K1","aero","What illusions can affect the landing after an approach?",
 "Rain on the windshield can make you appear higher than you are; haze makes the runway look farther away; featureless terrain/black-hole at night leads to a low approach; narrow runways make you feel high (risk of landing short); upsloping runways make you feel high too.",
 "AIM 8-1-5",[]],
["VIE","IR.VI.E.K1","atc","Contrast a visual approach and a contact approach.",
 "Visual: ATC-assigned or requested, IFR flight plan, must have the airport or preceding aircraft in sight, reported ceiling at least 1,000 ft and visibility at least 3 SM; no missed approach procedure. Contact: must be pilot-requested, ATC can't initiate; reported ground visibility at least 1 SM, remain clear of clouds, reasonable expectation to continue to the airport; needs a published approach at the airport.",
 "AIM ch. 5 sec. 4 (Visual approach; Contact approach); Pilot/Controller Glossary",[]],
// ===== VII.A Loss of communications =====
["VIIA","IR.VII.A.K1","comm","You're at 6,000 in IMC, cleared direct to the BRT VOR then as filed, and your radios go silent. What route and altitude do you fly?",
 "Squawk 7600. Route: the last assigned (direct BRT then the filed route). Altitude: the highest of the last assigned (6,000), the minimum IFR altitude for each segment, or the altitude ATC told you to expect. So 6,000 unless an MEA or expected altitude is higher on a segment. If you get into VFR conditions, continue VFR and land as soon as practicable.",
 "14 CFR 91.185(b)–(c); AIM 6-4-1",
 [["The next airway segment has an MEA of 8,000. Then it drops back to 5,000. What do you fly?","Climb to 8,000 for that segment (highest of the three), then return to 6,000, the last assigned altitude, when the MEA drops, since 6,000 is now the highest of the applicable altitudes.","14 CFR 91.185(c)(2)"],
  ["You were told 'expect 9,000 ten minutes after departure'. You lost comms at 5 minutes. What now?","Maintain the last assigned until the time to expect the higher altitude, then climb to 9,000 if it's higher than the MEA and the assigned altitude.","14 CFR 91.185(c)(2)(iii); AIM 6-4-1"]]],
["VIIA","IR.VII.A.K1","comm","You lose comms while being radar vectored. What route do you fly?",
 "Direct from the point of radio failure to the fix, route, or airway specified in the vector clearance, then follow the rest of the clearance.",
 "14 CFR 91.185(c)(1)(ii)",[]],
["VIIA","IR.VII.A.K1","comm","Lost comms, and your clearance limit is the destination airport's IAF. You arrive early. When do you start the approach?",
 "Hold at the clearance limit if needed and begin descent/approach as close as possible to the EFC time if you have one; otherwise as close as possible to the ETA calculated from your filed or amended estimated time en route.",
 "14 CFR 91.185(c)(3)(i)",
 [["What if the clearance limit is an en route fix, not an approach fix?","Leave the clearance limit at the EFC, or if none, upon arrival over it, proceed to a fix from which an approach begins, and start descent/approach as close as possible to the ETA.","14 CFR 91.185(c)(3)(ii)"]]],
["VIIA","IR.VII.A.K1","comm","What are your troubleshooting steps before deciding you're lost comms?",
 "Check volume and squelch, headset jacks, push-to-talk, frequency (go back to the previous one), comm 2, the audio panel, circuit breakers, try a different headset or handheld radio. Try Flight Service, 121.5, an ATC frequency on the chart, or relay through another aircraft. Squawk 7600 if you can't establish contact. Listen on the VOR voice feature if available.",
 "AIM 6-4-1, 6-4-2",[]],
["VIIA","IR.VII.A.K1","comm","Departure clearance: 'Fly runway heading, climb and maintain 3,000, expect 8,000 ten minutes after departure, radar vectors to V-438'. You lose comms right after takeoff in IMC. What do you do?",
 "Squawk 7600. Since you were never given the vector, use judgment: the regulation says follow the last route assigned; for a 'vectors to' clearance with no vector, most interpretations say fly direct to the fix/airway in the clearance (V-438) by the most direct reasonable route, after a safe climb (follow any ODP to clear obstacles). Climb to 3,000, then 8,000 at 10 minutes after departure (or MEA if higher).",
 "14 CFR 91.185(c); AIM 6-4-1; discuss with your CFII",[]],
["VIIA","IR.VII.A.K1","comm","You lose comms but you're in VMC between layers. What does the regulation say?",
 "Continue the flight under VFR and land as soon as practicable. That doesn't mean land at the nearest airport regardless of safety; it means don't continue IFR in the system. Notify ATC after landing.",
 "14 CFR 91.185(b); AIM 6-4-1",[]],
["VIIA","IR.VII.A.K1","comm","How would ATC try to reach you during lost comms, and how might you respond?",
 "They may broadcast on navaid voice frequencies or ask you to 'ident' or change your squawk to confirm you're receiving. If you can receive but not transmit, respond with the transponder (ident or code changes) as instructed.",
 "AIM 6-4-2",[]],
// ===== VII.D Loss of primary instruments =====
["VIID","IR.VII.D.K1","inst","How do you know your vacuum system failed, and what do you do?",
 "Low vacuum gauge or annunciator; the attitude and heading indicators slowly drift or tumble while the turn coordinator, airspeed, altimeter and VSI disagree with them. Cover the failed instruments, fly partial panel (turn coordinator, compass, ASI, altimeter, VSI), tell ATC, request a no-gyro vector/approach or VMC if available.",
 "FAA-H-8083-15 ch. 7; 14 CFR 91.187",
 [["How do you turn to a heading partial panel?","Timed turns at standard rate (3°/second) with the turn coordinator, or compass turns allowing for northerly turning and acceleration errors. Roll out and verify on the compass after it settles.","FAA-H-8083-15 ch. 7"],
  ["What is a no-gyro approach?","Radar approach where ATC tells you when to start and stop turns. Turns are standard rate until on final, then half standard rate.","AIM ch. 5 sec. 4 (Radar approaches – no-gyro)"]]],
["VIID","IR.VII.D.K2","inst","In a glass-cockpit airplane the PFD goes black. What now?",
 "Use the reversionary (display backup) mode to put flight instruments on the MFD, cross-check with the standby instruments, tell ATC, and evaluate whether to continue or divert to VMC/nearest suitable airport.",
 "POH/AFM (avionics); FAA-H-8083-15 ch. 7",[]],
["VIID","IR.VII.D.K2","inst","Your alternator fails in IMC. What's your plan?",
 "Recognize (ammeter discharge, low-volts annunciator), follow the POH (check breakers, reset), shed load to preserve the battery for essential nav/comm and lighting, tell ATC early, plan the most direct approach to VMC or a suitable airport. Consider the battery's estimated time remaining and a handheld radio/GPS backup.",
 "POH/AFM emergency procedures; 14 CFR 91.187",[]],
["VIID","IR.VII.D.K1","inst","The attitude indicator shows a bank but the turn coordinator and heading show wings level. Which do you trust?",
 "Cross-check: if the turn coordinator, heading indicator, and altimeter/VSI agree, the attitude indicator is likely failing. Cover it and fly partial panel. Advise ATC that you have a failed attitude indicator.",
 "FAA-H-8083-15 ch. 7; 14 CFR 91.187",[]],
// ===== VIII.A Postflight =====
["VIIIA","IR.VIII.A.K1","regs","After the flight you noticed the comm 2 was weak and the heading indicator precessed badly. What do you do?",
 "Write up the discrepancies in the maintenance log/squawk sheet. If an item is inoperative and the airplane will fly again before repair, it must be dealt with under the MEL or 91.213(d) (deactivated/placarded 'Inoperative' if allowed). Inform the owner or maintenance.",
 "14 CFR 91.213(d); 91.405; IR ACS VIII.A",[]],
["VIIIA","IR.VIII.A.K1","regs","What postflight paperwork is important for an IFR pilot?",
 "Close the IFR flight plan if not automatically closed, log instrument time and approaches (with type and location) and holding/tracking for currency, log the safety pilot's name if used, and record any VOR check you did (date, place, bearing error, signature).",
 "14 CFR 61.51(g); 91.169(d); 91.171(d)",[]],
// ===== More I.A / I.C / III =====
["IA","IR.I.A.K1","regs","Your friend wants to fly with you in IMC next month. You're instrument current but haven't landed in 4 months. Can you?",
 "Not with passengers until you meet 61.57(a): three takeoffs and landings within the preceding 90 days (to a full stop if tailwheel, and night ones at night per 61.57(b)). Instrument currency is a separate requirement.",
 "14 CFR 61.57(a)–(c)",[]],

function highlight(root,term){
  var words=term.toLowerCase().split(/\s+/).filter(function(w){return w.length>1;});if(!words.length)return;
  var re=new RegExp("("+words.map(function(w){return w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}).join("|")+")","gi");
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=walker.nextNode()))nodes.push(n);
  nodes.forEach(function(node){if(!re.test(node.nodeValue))return;re.lastIndex=0;var span=document.createElement("span");span.innerHTML=node.nodeValue.split(re).map(function(p,i){return i%2?"<mark>"+esc(p)+"</mark>":esc(p);}).join("");node.parentNode.replaceChild(span,node);});
}

// ---------- flashcards ----------
var FC=null;
function renderCardSetup(tid){
  var el=$("#v-cards");
  el.innerHTML='<h2>🃏 Flashcards</h2><div class="card">'+
  '<label class="row">Topic <select id="fTopic">'+topicOptions(tid||"all",true)+'</select></label>'+
  '<label class="row">Order <select id="fOrder"><option value="smart">Smart (weakest and least-seen first)</option><option value="shuffle">Random shuffle</option></select></label>'+
  '<label class="row">Session size <select id="fSize"><option value="20">20 cards</option><option value="10">10 cards</option><option value="40">40 cards</option><option value="0">All cards in topic</option></select></label>'+
  '<button class="btn" id="fStart">Start</button></div>'+
  '<p class="small muted">How it works: tap the card to flip it. <b>Got it</b> moves the card up a level so it shows up less often. <b>Review again</b> resets it and brings it back a few cards later in this session. Keyboard: Space = flip, 1 = review again, 2 = got it.</p>'+cardLevels(tid);
  $("#fStart").onclick=function(){startCards($("#fTopic").value,$("#fOrder").value,+$("#fSize").value);};
  $("#fTopic").onchange=function(){renderCardSetup(this.value==="all"?null:this.value);};
}
function cardLevels(tid){var cards=CARDS.filter(function(c){return !tid||tid==="all"||c.t===tid;});var lv=[0,0,0,0,0,0],unseen=0;
  cards.forEach(function(c){var r=S.cards[c.id];if(!r)unseen++;else lv[Math.min(5,r.box)]++;});
  return '<div class="card small"><b>'+cards.length+' cards</b> · New: '+unseen+' · Level 0: '+lv[0]+' · 1: '+lv[1]+' · 2: '+lv[2]+' · 3+: '+(lv[3]+lv[4]+lv[5])+' <span class="muted">(level 2+ counts as mastered)</span></div>';}
function startCards(tid,order,size){
  var pool=CARDS.filter(function(c){return tid==="all"||c.t===tid;});
  if(order==="smart"){pool=shuffle(pool).sort(function(a,b){var ra=S.cards[a.id],rb=S.cards[b.id];var ba=ra?ra.box:-1,bb=rb?rb.box:-1;
      // unseen (-1) first after weak (0) cards: weak=0, unseen=0.5
      var ka=ba===-1?0.5:ba,kb=bb===-1?0.5:bb;if(ka!==kb)return ka-kb;return (ra?ra.t:0)-(rb?rb.t:0);});}
  else pool=shuffle(pool);
  if(size>0)pool=pool.slice(0,size);
  FC={queue:pool,done:0,again:0,total:pool.length,tid:tid,order:order,size:size};
  drawCard();
}
function drawCard(){
  var el=$("#v-cards");
  if(!FC.queue.length){el.innerHTML='<h2>🃏 Session complete</h2><div class="card"><p>You worked through <b>'+FC.total+'</b> cards and pressed "review again" <b>'+FC.again+'</b> times.</p><button class="btn" id="fAgain">New session</button><button class="btn secondary" id="fSetup">Change topic</button></div>'+cardLevels(FC.tid);
    $("#fAgain").onclick=function(){startCards(FC.tid,FC.order,FC.size);};$("#fSetup").onclick=function(){renderCardSetup(FC.tid==="all"?null:FC.tid);};return;}
  var c=FC.queue[0],t=TOPIC[c.t],r=S.cards[c.id];
  el.innerHTML='<div class="row small muted" style="display:flex;justify-content:space-between"><span>'+FC.done+' done · '+FC.queue.length+' left</span><span>Level '+(r?r.box:"new")+'</span></div>'+
  '<div class="bar"><div style="width:'+pct(FC.done,FC.total)+'%"></div></div>'+
  '<div class="flash" id="flash"><div class="flash-inner"><div class="face front"><span class="tag">'+t.icon+' '+esc(t.name)+'</span><div>'+esc(c.q)+'</div><span class="hint">tap to flip</span></div>'+
  '<div class="face back"><span class="tag">Answer</span><div>'+esc(c.a)+'</div></div></div></div>'+
  '<div style="display:flex;gap:8px"><button class="btn bad" id="fBad" style="flex:1">↺ Review again</button><button class="btn good" id="fGood" style="flex:1">✓ Got it</button></div>'+
  '<button class="btn secondary" id="fQuit">End session</button>';
  var fl=$("#flash");fl.onclick=function(){fl.classList.toggle("flipped");};
  $("#fGood").onclick=function(){gradeCard(true);};$("#fBad").onclick=function(){gradeCard(false);};
  $("#fQuit").onclick=function(){FC.queue=[];drawCard();};
}
function gradeCard(ok){
  var c=FC.queue.shift();var r=S.cards[c.id]||{box:0,n:0,t:0};r.n++;r.t=Date.now();
  if(ok){r.box=Math.min(5,(S.cards[c.id]?r.box+1:1));FC.done++;}
  else{r.box=0;FC.again++;var pos=Math.min(FC.queue.length,3+Math.floor(Math.random()*3));FC.queue.splice(pos,0,c);}
  S.cards[c.id]=r;save();drawCard();
}
document.addEventListener("keydown",function(e){
  if($("#v-cards").classList.contains("hidden")||!$("#flash"))return;
  if(e.target&&e.target.tagName==="INPUT")return;
  if(e.key===" "){e.preventDefault();$("#flash").classList.toggle("flipped");}

});

function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?{y:+m[1],m:+m[2],d:+m[3]}:null;}

// --- IFR currency, 61.57(c)/(d) ---
// Tasks count if logged within the 6 calendar months preceding the month of the flight (tasks earlier in the
// month of the flight also count). So tasks completed in month X keep you current through the last day of month X+6.
function curMet(list,F,cut){var a=0,h=false,t=false,ipc=false;
  list.forEach(function(e){var m=mi(e.date);if(m===null||e.date>cut||m<F-6||m>F)return;if(e.ipc)ipc=true;a+=num(e.appr);if(e.hold)h=true;if(e.track)t=true;});
  return {ok:ipc||(a>=6&&h&&t),appr:a,hold:h,track:t,ipc:ipc};}
function currency(list,asOf){
  asOf=asOf||todayStr();var T=mi(asOf),now=curMet(list,T,asOf),r={asOf:asOf,window:bom(T-6),now:now};
  if(now.ok){var F=T;while(F<T+8&&curMet(list,F+1,asOf).ok)F++;r.status="current";r.expires=eom(F);return r;}
  var E=null;for(var k=T-1;k>=T-240;k--){if(curMet(list,k,eom(k)<asOf?eom(k):asOf).ok){E=k;break;}}
  if(E===null){r.status="never";return r;}

function totals(l,testDate){

    if(dv==="AIR"){t.total+=num(f.total);t.xc+=num(f.xc);t.xcAir+=num(f.xc);t.act+=num(f.act);t.simAir+=num(f.sim);
      if(f.date>=from&&f.date<=td)t.recent+=num(f.dual);}
    else{t.dev[dv]=(t.dev[dv]||0)+num(f.sim)+num(f.act);}

  var nres=[];IDX.forEach(function(ix){var hits=ix.chunks.filter(function(c){return matchAll(c,words);});if(hits.length)nres.push({t:ix.t,hits:hits});});

  var qres=QUIZ.filter(function(q){return matchAll(q.q+" "+q.o.join(" ")+" "+q.e,words);});
  var html='<h2>🔎 Results for "'+esc(term)+'"</h2><p class="small muted">'+nres.reduce(function(s,r){return s+r.hits.length;},0)+' note matches · '+cres.length+' flashcards · '+qres.length+' quiz questions</p>';
  if(nres.length)html+='<h3>Study notes</h3><div class="card" style="padding:0">'+nres.map(function(r){return r.hits.slice(0,4).map(function(h){return '<div class="result" data-t="'+r.t.id+'"><span class="pill">'+r.t.icon+' '+esc(r.t.name)+'</span><div class="small">'+hlText(h.length>260?h.slice(0,260)+"…":h,words)+'</div></div>';}).join("");}).join("")+'</div>';
  if(cres.length)html+='<h3>Flashcards</h3><div class="card" style="padding:0">'+cres.slice(0,30).map(function(c){return '<div class="result sc"><span class="pill">'+TOPIC[c.t].icon+' '+esc(TOPIC[c.t].name)+'</span><div><b>'+hlText(c.q,words)+'</b></div><div class="small muted ans hidden">'+hlText(c.a,words)+'</div><div class="small muted tap">tap to show answer</div></div>';}).join("")+'</div>';
  if(qres.length)html+='<h3>Quiz questions</h3><div class="card" style="padding:0">'+qres.slice(0,30).map(function(q){return '<div class="result sc"><span class="pill">'+TOPIC[q.t].icon+' '+esc(TOPIC[q.t].name)+'</span><div><b>'+hlText(q.q,words)+'</b></div><div class="small ans hidden">Answer: <b>'+esc(q.o[q.a])+'</b>. '+hlText(q.e,words)+'</div><div class="small muted tap">tap to show answer</div></div>';}).join("")+'</div>';
  if(!nres.length&&!cres.length&&!qres.length)html+='<p>No matches. Try fewer or different words (e.g., "alternate", "RAIM", "holding").</p>';
  el.innerHTML=html;show("search");
  el.querySelectorAll(".result[data-t]").forEach(function(d){d.onclick=function(){renderNotes(d.dataset.t,term);};});
  el.querySelectorAll(".result.sc").forEach(function(d){d.onclick=function(){d.querySelector(".ans").classList.toggle("hidden");d.querySelector(".tap").classList.toggle("hidden");};});
}
var st;$("#search").addEventListener("input",function(){var v=this.value;clearTimeout(st);st=setTimeout(function(){doSearch(v);},200);});
$("#search").addEventListener("keydown",function(e){if(e.key==="Enter"){clearTimeout(st);doSearch(this.value);this.blur();}});
// ---------- init ----------
$("#countInfo").textContent=TOPICS.length+" topics · "+CARDS.length+" flashcards · "+QUIZ.length+" quiz questions";
window.IFR={auditor:AUDITOR,coach:COACH,go:go,doSearch:doSearch,startQuiz:startQuiz,startCards:startCards,answer:answer,gradeCard:gradeCard,state:function(){return S;},counts:{topics:TOPICS.length,cards:CARDS.length,quiz:QUIZ.length}};
go("home");
})();

</script>
