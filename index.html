<script>
const TOPICS = [];
TOPICS.push({id:"inst", name:"Flight Instruments", icon:"🧭", notes:`
<h3>Pitot-static system</h3>
<ul>
<li><b>Pitot tube</b> (ram air) feeds only the <b>airspeed indicator</b>. <b>Static ports</b> feed the <b>ASI, altimeter, and VSI</b>.</li>
<li><b>Pitot ram inlet blocked, drain hole open:</b> ASI drops to zero.</li>
<li><b>Pitot inlet AND drain hole blocked:</b> ASI acts like an altimeter. It reads <b>higher in a climb</b> and <b>lower in a descent</b>, and it doesn't respond to real airspeed changes in level flight.</li>
<li><b>Static port blocked:</b> altimeter freezes, VSI reads zero, and ASI reads <b>low in a climb</b> and <b>high in a descent</b> (dangerous, because you can overspeed without knowing it).</li>
<li><b>Alternate static source</b> (cabin air, slightly lower pressure): altimeter reads <b>higher</b>, ASI reads <b>higher</b>, and VSI shows a <b>momentary climb</b>. Breaking the VSI glass is a last-resort static source, and the VSI then reads reversed.</li>
</ul>
<h3>Altimeter</h3>
<ul>
<li>An aneroid barometer. Standard is <b>29.92 inHg / 15°C</b> at sea level. Pressure drops about <b>1 inHg per 1,000 ft</b> and temperature about <b>2°C per 1,000 ft</b>.</li>
<li><b>"High to low, look out below."</b> When you fly from high to low pressure, or into colder air, without resetting, your true altitude is <b>lower</b> than indicated.</li>
<li>0.01 inHg ≈ 10 ft. Example: if the altimeter is set to 30.00 when it should be 29.50, you're about 500 ft lower than indicated.</li>
<li>Types of altitude: indicated, pressure (29.92 set), density (pressure alt corrected for temperature), true (MSL), and absolute (AGL).</li>
<li><b>Preflight:</b> with the current setting, the altimeter should read within <b>±75 ft</b> of field elevation.</li>
<li>Cold Temperature Airports (snowflake icon ❄ and a temperature) need altitude corrections below the published temperature.</li>
<li><b>91.121:</b> below 18,000 MSL, use the current setting of a station within <b>100 NM</b>. At or above 18,000 MSL, set <b>29.92</b>.</li>
</ul>
<h3>Vertical speed indicator</h3>
<ul><li>A differential-pressure instrument with a calibrated leak. It shows the <b>trend</b> right away, but the <b>rate</b> lags 6–9 seconds. The IVSI uses accelerometer pumps to cut the lag.</li></ul>
<h3>Gyroscopic instruments</h3>
<ul>
<li>Gyro properties: <b>rigidity in space</b> and <b>precession</b>.</li>
<li><b>Attitude indicator:</b> usually vacuum-driven (about 4.5–5.5 inHg suction; see the POH). It can show small errors after a 180° turn or during acceleration.</li>
<li><b>Heading indicator:</b> it precesses, so <b>align it with the magnetic compass about every 15 minutes</b> in straight, level, unaccelerated flight. Up to 3° of drift in 15 minutes is acceptable.</li>
<li><b>Turn coordinator:</b> a canted gyro (usually electric) that shows <b>rate of roll and rate of turn</b>. The <b>turn-and-slip indicator</b> shows rate of turn only. Neither shows bank angle.</li>
<li><b>Inclinometer (ball):</b> "step on the ball." In a <b>slip</b>, the ball falls to the inside of the turn (not enough rudder). In a <b>skid</b>, the ball goes to the outside (too much rudder).</li>
<li><b>Standard-rate turn = 3°/sec</b> (2 minutes for 360°). Bank ≈ <b>(TAS ÷ 10) + 7</b>.</li>
<li>Taxi check: the AI erects within 5 minutes and doesn't tilt more than 5° in a turn; in a turn, the turn needle/airplane deflects and the ball moves to the outside; the HI and compass agree with the turn direction.</li>
<li><b>Glass panels:</b> the <b>AHRS</b> supplies attitude and heading, and the <b>ADC</b> supplies airspeed, altitude, and vertical speed. If the ADC fails, you get red X's on airspeed, altitude, and VS, so use the standby instruments.</li>
</ul>
<h3>Magnetic compass errors</h3>
<ul>
<li>Variation, deviation (correction card), magnetic dip, oscillation.</li>
<li><b>Northerly turning error</b> (Northern Hemisphere): <b>UNOS</b>, Undershoot North, Overshoot South. When turning to north, roll out <b>before</b> the heading (lead by about the latitude plus half the bank angle). When turning to south, roll out <b>after</b> it.</li>
<li><b>Acceleration error</b> on east/west headings: <b>ANDS</b>, Accelerate = North, Decelerate = South.</li>
</ul>
`});
TOPICS.push({id:"aif", name:"Attitude Instrument Flying", icon:"✈️", notes:`
<h3>Fundamental skills</h3>
<ol><li><b>Instrument cross-check</b> (scan)</li><li><b>Instrument interpretation</b></li><li><b>Aircraft control</b> (pitch, bank, power, trim)</li></ol>
<h3>Two methods (Instrument Flying Handbook)</h3>
<ul>
<li><b>Control and performance:</b> <b>control</b> instruments (attitude indicator and power instruments) set the attitude and power. <b>Performance</b> instruments (altimeter, ASI, VSI, HI, turn coordinator) show the result. <b>Navigation</b> instruments show position.</li>
<li><b>Primary and supporting:</b> for pitch, bank, and power, the <b>primary</b> instrument gives the most pertinent information for the maneuver, and the others <b>support</b> it.</li>
</ul>
<h3>Primary instruments</h3>
<table>
<tr><th>Maneuver</th><th>Pitch</th><th>Bank</th><th>Power</th></tr>
<tr><td>Straight &amp; level</td><td>Altimeter</td><td>Heading indicator</td><td>Airspeed indicator</td></tr>
<tr><td>Level standard-rate turn</td><td>Altimeter</td><td>Turn coordinator</td><td>Airspeed indicator</td></tr>
<tr><td>Constant-airspeed climb or descent</td><td>Airspeed indicator</td><td>Heading indicator</td><td>Tach/MP (set power)</td></tr>
<tr><td>Constant-rate climb or descent</td><td>VSI</td><td>Heading indicator</td><td>Airspeed indicator</td></tr>
<tr><td>Airspeed change in level flight</td><td>Altimeter</td><td>Heading indicator</td><td>Tach/MP during the change</td></tr>
</table>
<p>The <b>attitude indicator</b> is the only instrument that shows pitch and bank directly. It <b>supports</b> everything and is <b>primary during transitions</b> (entering a turn or starting a climb).</p>
<h3>Scan</h3>
<ul>
<li><b>Radial (hub-and-spoke) scan:</b> centered on the AI, with quick glances out and back. Also the inverted-V and rectangular scans.</li>
<li>Scan errors: <b>fixation</b> (staring at one instrument), <b>omission</b> (leaving one out), <b>emphasis</b> (relying on one instrument).</li>
</ul>
<h3>Rules of thumb</h3>
<ul>
<li><b>Level-off lead ≈ 10% of the vertical speed</b> (50 ft early at 500 fpm).</li>
<li>For small heading changes, bank no more than the number of degrees to turn, up to standard rate.</li>
<li>Altitude corrections under 100 ft: about a half-bar-width pitch change. For larger ones, use a descent or climb rate of about twice the error, in fpm.</li>
<li><b>Unusual attitude recovery:</b> <b>nose high</b>: add power, lower the nose, level the wings. <b>Nose low</b>: reduce power, level the wings, raise the nose. You've recovered when the altimeter and ASI stop moving and the turn coordinator is level.</li>
<li><b>Partial panel</b> (AI/HI failed): cover the failed instruments, use the turn coordinator with <b>timed turns</b> (3°/sec), the magnetic compass, and the altimeter, VSI, and ASI for pitch.</li>
<li>Trim off the control pressure after every attitude or power change.</li>
</ul>
`});

TOPICS.push({id:"regs", name:"IFR Regulations (14 CFR)", icon:"📜", notes:`
<h3>61.57(c) Instrument currency: "6 HIT" in 6 calendar months</h3>
<ul>
<li>Within the preceding <b>6 calendar months</b> (aircraft, or an FFS, FTD, or ATD as allowed): <b>6 instrument approaches</b>, <b>Holding procedures and tasks</b>, and <b>Intercepting and Tracking courses</b> through the use of navigational electronic systems.</li>
<li>If you lapse, you have <b>6 more calendar months</b> to regain currency with a safety pilot, sim, or instructor. You can't act as PIC under IFR in the meantime.</li>
<li>Once <b>12 calendar months</b> have passed with no currency, you need an <b>IPC (61.57(d))</b> from a CFII, examiner, or other authorized person, using the Instrument Rating ACS tasks.</li>
<li>Safety pilot: at least a private pilot certificate with the category and class ratings, a medical certificate (as required crew), and adequate visibility. Dual controls are required (91.109).</li>
</ul>
<h3>91.167 IFR fuel requirements (airplanes)</h3>
<ul><li>Enough fuel to fly to the <b>first airport of intended landing</b>, then to the <b>alternate</b> (if one is required), and then for <b>45 minutes at normal cruise</b>. Helicopters need 30 minutes.</li></ul>
<h3>91.169 Alternate airports</h3>
<ul>
<li><b>1-2-3 rule:</b> no alternate is needed if the destination has a standard IAP and, from <b>1 hour before to 1 hour after the ETA</b>, the forecast ceiling is at least <b>2,000 ft</b> above airport elevation and visibility is at least <b>3 SM</b>.</li>
<li><b>Standard alternate minimums</b> (the forecast at the alternate, at your ETA there):
 <ul><li><b>Precision approach: 600 ft ceiling and 2 SM</b></li>
 <li><b>Nonprecision approach: 800 ft ceiling and 2 SM</b></li>
 <li><b>No IAP:</b> ceiling and visibility that allow descent from the MEA, approach, and landing under basic VFR</li></ul>
 Memory aid: <b>"600-2 precision, 800-2 non-precision."</b></li>
<li><b>Nonstandard alternate minimums</b>: a black triangle with <b>A</b>. <b>"A NA"</b> = alternate minimums not authorized.</li>
<li>Alternate minimums are for <b>planning</b> only. When you actually fly the approach there, use the published landing minimums.</li>
<li><b>GPS alternates (AIM 1-1-17/1-1-18):</b> <b>non-WAAS GPS with FDE</b> may plan a GPS-based IAP at <b>either the destination or the alternate, but not both</b>. Do a RAIM prediction and plan <b>LNAV or circling MDA</b> at the alternate (or LNAV/VNAV with approved baro-VNAV). <b>WAAS</b> users may use GPS at both, but must plan the alternate on <b>LNAV or circling</b> minimums with nonprecision (800-2) alternate weather. On arrival they may use LPV or LNAV/VNAV if the box shows it's available.</li>
</ul>
<h3>91.171 VOR check (required for IFR)</h3>
<ul>
<li>Within the preceding <b>30 days</b>.</li>
<li><b>VOT: ±4°</b> (needle centers on <b>0° FROM or 180° TO</b>). <b>Repair-station test signal: ±4°</b>. <b>Ground checkpoint: ±4°</b>. <b>Airborne checkpoint: ±6°</b>. Airborne check along a charted airway, over a prominent ground point more than 20 NM from the station: <b>±6°</b>. <b>Dual VOR check:</b> the two indications within <b>4° of each other</b>.</li>
<li>Logbook entry: <b>DEPS</b> = <b>D</b>ate, <b>E</b>rror (bearing error), <b>P</b>lace, <b>S</b>ignature.</li>
</ul>
<h3>91.175 Takeoff and landing under IFR</h3>
<ul>
<li>You may not descend below <b>DA/DH or MDA</b> unless <b>all</b> of these are true:
<ol><li>The aircraft is <b>continuously in a position to land</b> on the intended runway at a <b>normal rate of descent using normal maneuvers</b> (for Parts 121/135, within the touchdown zone).</li>
<li><b>Flight visibility</b> is not less than the visibility prescribed for the approach.</li>
<li>At least <b>one</b> of these visual references for the intended runway is distinctly visible and identifiable:
<ul><li><b>Approach light system</b>. You can't descend below <b>100 ft above TDZE</b> on the approach lights alone unless the <b>red terminating bars or red side row bars</b> are also distinctly visible.</li>
<li>Threshold, threshold markings, threshold lights</li><li>Runway end identifier lights (REIL)</li><li>Visual glideslope indicator (VASI/PAPI)</li>
<li>Touchdown zone, TDZ markings, TDZ lights</li><li>Runway, runway markings, runway lights</li></ul></li></ol></li>
<li>Go missed at DA or the MAP if the requirements aren't met, or any time below DA/MDA that you lose the visual references (except normal bank while circling).</li>
<li><b>Takeoff minimums</b> (91.175(f)) apply only to Parts <b>121, 125, 129, and 135</b>: <b>1 SM</b> for 1–2 engines and <b>½ SM</b> for 3 or more. <b>Part 91 has no legal takeoff minimums</b>, but nonstandard minimums, ODPs, and common sense still apply.</li>
</ul>
<h3>91.185 Two-way radio communications failure</h3>
<ul>
<li><b>VFR conditions</b> (if you're in them or encounter them): continue VFR and <b>land as soon as practicable</b>.</li>
<li><b>IMC route (AVEF):</b> <b>A</b>ssigned route. If being radar <b>V</b>ectored, go direct to the fix, route, or airway in the vector clearance. If none, fly the route ATC said to <b>E</b>xpect. If none, fly the route <b>F</b>iled.</li>
<li><b>Altitude (MEA):</b> fly the <b>highest</b> of these for the route segment: <b>M</b>inimum IFR altitude, <b>E</b>xpected altitude, or <b>A</b>ssigned altitude.</li>
<li><b>Leaving the clearance limit:</b> if the limit is a fix where an approach begins, start the descent and approach as close as possible to the <b>EFC</b> (or, if none, the <b>ETA</b> from the filed or amended ETE). If the limit is not an approach fix, leave it at the EFC (or on arrival if none), proceed to an approach fix, and start the descent and approach as close as possible to the ETA.</li>
<li>Squawk <b>7600</b>, keep listening, and transmit blind.</li>
</ul>
<h3>91.205(d) IFR instruments and equipment: GRABCARD</h3>
<ul>
<li><b>G</b>enerator or alternator of adequate capacity</li>
<li><b>R</b>adios: two-way comm and nav equipment suitable for the route</li>
<li><b>A</b>ltimeter: sensitive, adjustable for barometric pressure</li>
<li><b>B</b>all: slip-skid indicator</li>
<li><b>C</b>lock: hours, minutes, and seconds, with a sweep-second pointer or digital display</li>
<li><b>A</b>ttitude indicator (gyroscopic)</li>
<li><b>R</b>ate-of-turn indicator (gyroscopic)</li>
<li><b>D</b>irectional gyro (gyroscopic heading indicator)</li>
<li>Plus all VFR day and night equipment. At or above <b>FL240</b>, if VOR is required for navigation, you also need <b>DME or suitable RNAV</b> (91.205(e)).</li>
</ul>
<h3>Inspections</h3>
<ul>
<li><b>91.411:</b> altimeter system, static system, and automatic altitude reporting (encoder) tested within <b>24 calendar months</b> for IFR in controlled airspace.</li>
<li><b>91.413:</b> ATC transponder tested within <b>24 calendar months</b>.</li>
<li>Memory aid <b>AV1ATE</b>: <b>A</b>Ds, <b>V</b>OR check (30 days, IFR), <b>1</b>00-hour (for hire or instruction), <b>A</b>nnual (12 calendar months), <b>A</b>ltimeter/static (24 months, IFR), <b>T</b>ransponder (24 months), <b>E</b>LT (12 months; replace the battery after 1 cumulative hour of use or at 50% of its useful life).</li>
</ul>
<h3>Other key rules</h3>
<ul>
<li><b>91.173:</b> IFR in controlled airspace requires a filed IFR flight plan and an ATC clearance.</li>
<li><b>91.177 minimum IFR altitudes:</b> use the published MEA, MOCA, etc. Where none is published: <b>2,000 ft</b> above the highest obstacle within <b>4 NM</b> of course in mountainous areas, and <b>1,000 ft</b> elsewhere. MOCA can be used only within <b>22 NM</b> of the VOR.</li>
<li><b>91.179 IFR cruising altitudes</b> (uncontrolled airspace, below 18,000 MSL): magnetic course <b>0–179° = odd thousands</b> and <b>180–359° = even thousands</b>. In controlled airspace, fly what ATC assigns.</li>
<li><b>91.183:</b> report the time and altitude over designated reporting points, unforecast weather, and safety-of-flight information.</li>
<li><b>91.187:</b> report nav, approach, and comm equipment malfunctions (see Required Reports).</li>
<li><b>91.103:</b> IFR preflight must include weather reports and forecasts, fuel requirements, alternatives available if the flight can't be completed as planned, known ATC delays, and runway lengths and takeoff/landing data.</li>
<li><b>91.211 oxygen:</b> required crew must use it for any time over <b>30 minutes</b> spent above <b>12,500 ft</b> up to and including <b>14,000 ft</b> cabin altitude, and at all times above <b>14,000 ft</b>. Above <b>15,000 ft</b>, each occupant must be provided oxygen.</li>
<li><b>91.117 speeds:</b> 250 KIAS below 10,000 MSL. 200 KIAS beneath Class B or in a VFR corridor. 200 KIAS at or below 2,500 AGL within 4 NM of the primary airport of Class C/D.</li>
<li><b>61.51(g) logging:</b> instrument time is logged only when flying solely by reference to instruments. Log each approach's <b>location and type</b>, and the <b>safety pilot's name</b> for simulated conditions.</li>
</ul>

TOPICS.push({id:"air", name:"Airspace & IFR Minimums", icon:"🗺️", notes:`
<h3>Airspace classes</h3>
<ul>
<li><b>Class A:</b> 18,000 MSL up to and including FL600. <b>IFR only</b>, instrument rating, clearance, ADS-B Out, and an altimeter setting of 29.92.</li>
<li><b>Class B:</b> requires an ATC clearance, a Mode C/ADS-B veil (30 NM), and VFR: <b>3 SM, clear of clouds</b>.</li>
<li><b>Class C:</b> two-way radio communication. VFR: <b>3 SM, 500 below, 1,000 above, 2,000 horizontal</b> ("3-152").</li>
<li><b>Class D:</b> two-way radio communication. VFR 3-152.</li>
<li><b>Class E:</b> all other controlled airspace. It usually starts at <b>1,200 AGL</b>, at <b>700 AGL</b> near airports with IAPs (magenta vignette), or at the surface (dashed magenta). <b>Victor airways</b> are Class E from 1,200 AGL up to (not including) 18,000 MSL, 4 NM either side of centerline.</li>
<li>Class E VFR: below 10,000 MSL is <b>3-152</b>. At or above 10,000 MSL: <b>5 SM, 1,000 below, 1,000 above, 1 SM horizontal</b>.</li>
<li><b>Class G:</b> uncontrolled. At or below 1,200 AGL: day 1 SM, clear of clouds; night 3 SM, 152. IFR in Class G doesn't need a clearance.</li>
<li><b>Special-use airspace:</b> prohibited, restricted, warning, MOA, alert, CFA, NSA. ATC may route IFR traffic through a restricted area or MOA only when it's not active, or it provides separation.</li>
</ul>
<h3>IFR weather minimums</h3>
<ul>
<li><b>En route:</b> no weather minimums, but you need a clearance in controlled airspace.</li>
<li><b>Takeoff:</b> none for Part 91. Standard (1 SM or ½ SM) for commercial operators. Black triangle "T" means nonstandard takeoff minimums and/or an ODP.</li>
<li><b>Landing:</b> the IAP minimums (DA/MDA and visibility). <b>Filing an alternate:</b> 600-2 / 800-2 or as published.</li>
<li><b>Special VFR</b> (91.157): below 10,000 MSL within the surface area of Class B, C, D, or E. Requires <b>1 SM</b> flight visibility and staying <b>clear of clouds</b>. At night, it requires an <b>instrument rating and an IFR-equipped airplane</b>.</li>
<li><b>VFR-on-top</b> (an IFR clearance): fly <b>VFR cruising altitudes</b> (odd or even thousands plus 500), keep <b>VFR visibility and cloud clearance</b>, and follow IFR rules (minimum IFR altitudes, reports, course). Not allowed in <b>Class A</b>.</li>
<li><b>VFR over the top</b> is a VFR flight (no IFR clearance).</li>
<li><b>RVR → visibility:</b> 1600 = ¼ SM · 2400 = ½ · 3200 = ⅝ · 4000 = ¾ · 4500 = ⅞ · 5000 = 1 · 6000 = 1¼.</li>
</ul>
<h3>Equipment</h3>
<ul><li><b>ADS-B Out (91.225)</b> and Mode C (91.215) are required in Class A, B, and C, inside the 30 NM Mode C veil, above the ceiling of Class B/C within their lateral limits (up to 10,000 MSL), and above 10,000 MSL excluding at and below 2,500 AGL.</li></ul>

TOPICS.push({id:"wx", name:"Weather Theory & Products", icon:"⛈️", notes:`
<h3>Theory</h3>
<ul>
<li><b>Standard lapse rate</b> ≈ <b>2°C per 1,000 ft</b>. Standard sea-level conditions are 15°C and 29.92 inHg.</li>
<li><b>Cloud base estimate:</b> (temperature − dewpoint) in °C ÷ 2.5 × 1,000 ft AGL (or °F ÷ 4.4).</li>
<li><b>Stable air:</b> stratiform clouds, steady rain, smooth air, poor visibility. <b>Unstable air:</b> cumuliform clouds, showers, turbulence, good visibility.</li>
<li><b>Fronts:</b> cold front = fast, narrow band of weather, thunderstorms. Warm front = slow, widespread low ceilings, and possible freezing rain. A wind shift and pressure change happen when you cross any front.</li>
</ul>
<h3>Thunderstorms</h3>
<ul>
<li>Three requirements: <b>sufficient moisture, an unstable lapse rate, and a lifting action</b>.</li>
<li>Stages: <b>cumulus</b> (updrafts) → <b>mature</b> (starts when <b>precipitation reaches the surface</b>; updrafts and downdrafts; most intense) → <b>dissipating</b> (downdrafts dominate).</li>
<li>Avoid severe storms by at least <b>20 NM</b>. Don't fly under the anvil (hail). <b>Embedded thunderstorms</b> are hidden in IMC.</li>
<li><b>Squall line:</b> a non-frontal line of storms ahead of a cold front. Often the most severe.</li>
<li>Hazards include severe turbulence, hail, icing, lightning, wind shear, tornadoes, and altimeter errors.</li>
<li><b>Microburst:</b> downdrafts up to about <b>6,000 fpm</b>, under about 2.5 miles across, and usually over within <b>about 15 minutes</b>. On approach, expect a headwind and performance <b>increase</b>, then a downdraft, then a <b>tailwind</b> and a sharp performance <b>loss</b>.</li>
</ul>
<h3>Icing</h3>
<ul>
<li>Structural icing needs <b>visible moisture</b> and an airframe at or below <b>0°C</b>.</li>
<li><b>Clear ice:</b> large supercooled drops (freezing rain, cumulus), roughly 0 to −10°C. Heavy, hard, smooth, and the most dangerous.</li>
<li><b>Rime ice:</b> small drops that freeze instantly (stratus), colder. Rough and milky. <b>Mixed ice</b> is a combination.</li>
<li><b>Freezing rain</b> means there's a <b>temperature inversion</b> with warmer air (above 0°C) above you. <b>Ice pellets</b> at the surface mean there's freezing rain at a higher altitude.</li>
<li>Even a small amount of frost or ice on the wings disrupts airflow and raises stall speed. Remove all frost before flight.</li>
</ul>
<h3>Fog</h3>
<ul>
<li><b>Radiation fog:</b> clear, calm nights (wind under 5 kt), high humidity, low-lying areas. It burns off after sunrise.</li>
<li><b>Advection fog:</b> moist air moving over a colder surface. Coastal, and it can persist with wind up to about 15 kt.</li>
<li><b>Upslope fog:</b> moist, stable air pushed up terrain and cooled adiabatically.</li>
<li><b>Steam fog:</b> cold air over warmer water. Low-level turbulence and icing are possible.</li>
<li><b>Precipitation-induced fog:</b> warm rain falling through cool air, usually with fronts. <b>Ice fog:</b> very cold temperatures, common in interior Alaska.</li>
<li>A small and <b>decreasing temperature/dewpoint spread</b> means fog or low clouds are likely.</li>
</ul>
<h3>Observations and forecasts</h3>
<ul>
<li><b>METAR</b> (hourly) and <b>SPECI</b> (special). Order: station, date/time Z, wind, visibility, RVR, weather, sky, temp/dew, altimeter, remarks. A <b>ceiling</b> is the lowest <b>BKN or OVC</b> layer or <b>vertical visibility (VV)</b>. Example: <code>METAR PANC 281753Z 34008KT 2SM -SN BR OVC008 M04/M06 A2992</code></li>
<li><b>TAF:</b> covers a <b>5 SM radius</b> of the airport center, usually <b>24 or 30 hours</b>, and issued 4 times daily (00, 06, 12, 18Z). FM = from, TEMPO = temporary fluctuations (under 1 hour at a time and less than half the period), PROB30/40, BECMG. <code>P6SM</code> = more than 6 SM. <code>WS</code> = low-level wind shear.</li>
<li><b>PIREP:</b> <b>UA</b> routine, <b>UUA</b> urgent. /OV location · /TM time · /FL altitude · /TP aircraft type · /SK sky · /WX · /TA temp · /WV wind · /TB turbulence · /IC icing · /RM. The best source of actual tops, icing, and turbulence.</li>
<li><b>AIRMET / G-AIRMET:</b> <b>Sierra</b> = IFR (ceilings under 1,000 ft and/or visibility under 3 SM over more than 50% of the area) and mountain obscuration. <b>Tango</b> = moderate turbulence, sustained surface winds of 30 kt or more, non-convective LLWS. <b>Zulu</b> = moderate icing and freezing levels. <b>CONUS text AIRMETs were retired in January 2025</b>, so the <b>G-AIRMET</b> (snapshots every <b>3 hours</b> out to 12 hours) is the product there. <b>Alaska and Hawaii still issue text AIRMETs</b>, and Alaska still has a text Area Forecast.</li>
<li><b>SIGMET</b> (non-convective, significant to all aircraft): <b>severe icing</b> not associated with thunderstorms, <b>severe or extreme turbulence</b> or CAT not associated with thunderstorms, <b>dust or sandstorms</b> with visibility under 3 SM, and <b>volcanic ash</b>. Valid up to <b>4 hours</b> (6 for hurricanes and volcanic ash).</li>
<li><b>Convective SIGMET (WST):</b> tornadoes, lines of thunderstorms, embedded thunderstorms, thunderstorm areas of 40% or more coverage over 3,000 sq mi or more, hail ≥ ¾ in, and surface winds ≥ 50 kt. Issued hourly at <b>H+55</b> and valid <b>2 hours</b>. It implies severe turbulence, severe icing, and LLWS.</li>
<li><b>CWA</b> (Center Weather Advisory): issued by the ARTCC weather unit. A nowcast valid up to 2 hours.</li>
<li><b>GFA</b> (Graphical Forecasts for Aviation) replaced the CONUS text Area Forecast in 2017.</li>
<li><b>Winds and temperatures aloft (FB):</b> no wind is forecast within 1,500 ft of station elevation, and no temperature at the 3,000 ft level or within 2,500 ft of the station. <code>9900</code> = light and variable. If the direction code is 51–86, subtract 50 from the direction and add 100 to the speed (<code>7325</code> = 230° at 125 kt). Temperatures above 24,000 ft are negative.</li>
<li><b>Datalink (FIS-B/ADS-B) NEXRAD</b> may be <b>several to 15–20 minutes older</b> than its timestamp suggests. It's for strategic avoidance only, <b>never</b> for picking through cells.</li>
<li><b>Briefing types:</b> standard, abbreviated, and outlook (6 or more hours before departure).</li>
</ul>
`});

TOPICS.push({id:"charts", name:"Charts & Procedures", icon:"📈", notes:`
<h3>En route charts</h3>
<ul>
<li><b>IFR Low</b> (below 18,000 MSL): <b>Victor airways</b> (VOR) and <b>T-routes</b> (RNAV). <b>IFR High</b> (FL180–FL450): <b>Jet routes</b> and <b>Q-routes</b>.</li>
<li><b>MEA:</b> the lowest altitude between fixes that assures <b>nav signal coverage and obstacle clearance</b> (1,000 ft; 2,000 ft in mountainous areas).</li>
<li><b>MOCA</b> (marked with an asterisk *): obstacle clearance for the whole segment, but nav signal coverage only within <b>22 NM</b> of the VOR.</li>
<li><b>MRA</b> (flag with an R): the lowest altitude at which you can identify an intersection.</li>
<li><b>MCA</b> (flag with an X): the lowest altitude to cross a fix when heading toward a higher MEA.</li>
<li><b>MAA</b>: maximum authorized altitude. <b>MTA</b>: minimum turning altitude. <b>MVA</b>: ATC's minimum vectoring altitude (can be below the MEA). <b>OROCA</b>: Off-Route Obstruction Clearance Altitude, with 1,000 ft clearance (2,000 ft in mountains) and <b>no nav or comm guarantee</b>.</li>
<li><b>GNSS MEA</b>: a "G" suffix (e.g., 5000G).</li>
<li><b>Changeover point (COP):</b> a Z-shaped symbol with mileages. If none is shown, change at the midpoint.</li>
<li><b>Reporting points:</b> a <b>solid triangle = compulsory</b>, an <b>open triangle = on request</b>. Compulsory reports are needed only in non-radar or after "radar contact lost."</li>
</ul>
<h3>Departures</h3>
<ul>
<li><b>ODP</b> (Obstacle Departure Procedure): <b>obstacle clearance only</b>. Textual or graphic. Can be flown <b>without ATC assigning it</b>, and that's strongly recommended in IMC.</li>
<li><b>SID</b> (Standard Instrument Departure): obstacle clearance <b>plus ATC efficiency</b>. Always graphic. Requires an ATC clearance and at least the text description in your possession. Put <b>"NO SIDs"</b> in the remarks to decline.</li>
<li><b>Diverse departure</b> (no DP): cross the departure end of the runway at 35 ft or more, climb to <b>400 ft above airport elevation</b> before turning, and climb at <b>200 ft/NM</b> or more.</li>
<li><b>Climb gradient to rate:</b> ft/min = ft/NM × groundspeed ÷ 60. Example: 300 ft/NM at 120 kt = 600 fpm.</li>
<li>"<b>Climb via SID</b>" means comply with the published altitude and speed restrictions.</li>
</ul>
<h3>Arrivals</h3>
<ul><li><b>STAR</b>: a preplanned arrival from the en route structure to the terminal area. You need the text description at minimum. Decline with "NO STARs." "<b>Descend via</b>" means descend at pilot's discretion while meeting the published restrictions. It does <b>not</b> clear you for the approach.</li></ul>
<h3>Approach chart layout</h3>
<ol>
<li><b>Pilot briefing information</b> (the top strip): procedure name, frequencies, primary navaid, final approach course, runway length, TDZE and airport elevation, <b>missed approach instructions</b>, notes and symbols (A, T), lighting.</li>
<li><b>Plan view:</b> feeder routes, IAF/IF/FAF, procedure turn or HILPT, terrain and obstacles, and the <b>MSA</b> (<b>1,000 ft</b> obstacle clearance within <b>25 NM</b>; emergency use only, not for navigation) or <b>TAA</b> (Terminal Arrival Area, <b>30 NM</b> sectors).</li>
<li><b>Profile view:</b> altitudes, <b>Maltese cross = FAF</b> (nonprecision), <b>lightning bolt = glideslope or glidepath intercept</b> (the FAF on precision approaches), VDP ("V"), missed approach icons, glidepath angle, TCH.</li>
<li><b>Minimums:</b> by category (A–E) and by type (straight-in or circling). DA/MDA, visibility (SM or RVR in hundreds of ft), and <b>HAT</b> (height above touchdown) or <b>HAA</b> (height above airport, for circling).</li>
<li><b>Airport sketch:</b> runways, approach lighting (e.g., an A5 symbol for MALSR), TDZE, and the <b>FAF-to-MAP time/distance table</b>.</li>
</ol>
<ul>
<li>Altitudes: <u>underlined</u> = minimum (at or above). Overlined = maximum. Both = mandatory.</li>
<li>Negative "C" on the circling line = expanded circling radii.</li>
<li><b>Chart Supplement</b> (and the <b>Alaska Supplement</b>): airport data, VOR checkpoints, frequencies, preferred IFR routes.</li>
</ul>
`});
TOPICS.push({id:"nav", name:"Navigation", icon:"📡", notes:`
<h3>VOR</h3>
<ul>
<li>VHF <b>108.00–117.95 MHz</b>, line of sight. <b>Always identify it by Morse code</b>. No ID (or a TEST code) means it's under maintenance and <b>unreliable</b>.</li>
<li>CDI: <b>10° full scale</b>, 5 dots = <b>2° per dot</b>. At 60 NM, 1° ≈ 1 NM.</li>
<li><b>Reverse sensing</b> on a CDI when the OBS is set opposite your heading. An HSI set to the course won't reverse-sense.</li>
<li><b>Service volumes:</b> T (terminal) 25 NM, 1,000–12,000 AGL. L (low) 40 NM up to 18,000 AGL. H (high) up to 130 NM at FL180–FL450. The new VOR MON designations (VL, VH) give at least 70 NM at 5,000 ft AGL.</li>
<li><b>VOR MON</b> (Minimum Operational Network) is the GPS backup. In the CONUS, you should be within 100 NM of an airport with an ILS or VOR approach that doesn't need GPS.</li>
<li><b>Station passage</b>: the TO/FROM flag reverses. Over the station, there's a cone of confusion.</li>
<li><b>Time to station</b> (min) = seconds to cross the bearing change ÷ degrees of bearing change.</li>
</ul>
<h3>DME</h3>
<ul><li>UHF, measuring <b>slant range</b>. The error is negligible if you're at least <b>1 NM from the station per 1,000 ft</b> of altitude. Directly over a station at 6,000 ft AGL, DME reads about 1 NM. Accuracy: ½ NM or 3%, whichever is greater.</li>
<li><b>DME arc:</b> lead the turn onto the arc (about 0.5 NM at 90 kt), then hold the arc with 10–20° heading corrections, keeping the reference radial near abeam.</li></ul>
<h3>ADF / NDB</h3>
<ul>
<li>NDB <b>190–535 kHz</b>. The ADF needle points <b>to the station</b>.</li>
<li><b>MH + RB = MB</b> (to the station). Bearing from the station = MB ± 180°.</li>
<li>Errors: <b>thunderstorms</b> (the needle swings toward lightning), <b>night effect</b> (skywave, worst at dusk and dawn), terrain, <b>shoreline effect</b>, and bank (dip) error.</li>
<li><b>Homing</b> (needle on the nose, a curved path in wind) vs. <b>tracking</b> (wind correction).</li>
<li><b>GPS substitution (AIM 1-2-3):</b> an IFR GPS may substitute for ADF and DME (identifying fixes, flying DME arcs, holding over an NDB), but not for <b>lateral guidance on the final approach course of an NDB or VOR approach</b> unless it's titled "or GPS."</li>
</ul>
<h3>ILS</h3>
<ul>
<li><b>Components:</b> <b>guidance</b> (localizer and glideslope), <b>range</b> (marker beacons, DME, compass locator, or fixes), and <b>visual</b> (approach lights, TDZ and centerline lights, runway lights).</li>
<li><b>Localizer:</b> <b>108.10–111.95 MHz, odd tenths</b>. <b>3–6° wide</b> (set to <b>700 ft wide at the threshold</b>), about <b>4× as sensitive as a VOR</b>. Coverage: <b>18 NM within ±10°</b> and <b>10 NM within ±35°</b>. Identified with a Morse ID prefixed "I" (e.g., I-ANC).</li>
<li><b>Back course:</b> reverse sensing on a CDI (unless you're using an HSI set to the front course). Usually no glideslope.</li>
<li><b>Glideslope:</b> UHF <b>329.15–335.00 MHz</b>, auto-paired with the localizer. Usually <b>3°</b>, about <b>1.4° thick</b> (±0.7°), usable to <b>10 NM</b>. <b>False glideslopes</b> exist above the true one (around 9°+).</li>
<li>For a 3° glideslope, descent rate (fpm) ≈ <b>groundspeed × 5</b> (90 kt → about 450 fpm).</li>
<li><b>Marker beacons</b> (75 MHz): <b>OM</b> 4–7 NM out, <b>blue</b>, 400 Hz dashes. <b>MM</b> about 3,500 ft out, <b>amber</b>, 1,300 Hz dot-dash. <b>IM</b>, <b>white</b>, 3,000 Hz dots.</li>
<li><b>Categories:</b> CAT I DH 200 ft, ½ SM or RVR 2400 (1800 with TDZ and centerline lights). CAT II DH 100 ft, RVR 1200. CAT III lower or no DH. CAT II and III need special authorization.</li>
<li><b>Glideslope inoperative</b>: the approach becomes a <b>localizer (nonprecision)</b> approach. Use the LOC minimums (MDA).</li>
<li><b>LDA:</b> localizer-type aid not aligned with the runway. <b>SDF:</b> 6° or 12° wide.</li>
</ul>
<h3>GPS / RNAV</h3>
<ul>
<li>A 3D fix needs <b>4 satellites</b>. <b>RAIM</b> (fault detection) needs <b>5</b>. <b>FDE</b> (fault detection and exclusion) needs <b>6</b> (or 5 with baro-aiding).</li>
<li><b>Pre-flight RAIM prediction</b> is required for non-WAAS (TSO-C129) receivers. If RAIM isn't available <b>before the FAF</b>, don't start the approach. If you get a RAIM alert after the FAF, <b>fly the missed approach</b>.</li>
<li><b>WAAS:</b> ground reference stations plus geostationary satellites correct the signal and provide integrity, which allows LPV, LNAV/VNAV, and LP. <b>GBAS</b> (formerly LAAS) supports GLS.</li>
<li><b>CDI scaling (TSO-C129):</b> en route <b>±5 NM</b> (±2 NM on many WAAS units), terminal <b>±1 NM</b> within <b>30 NM</b> of the airport, and approach tightens to <b>±0.3 NM</b> starting <b>2 NM before the FAF</b> (LPV becomes angular like a localizer).</li>
<li>The database must be current, and approaches must be loaded from the database. Never build them from hand-entered waypoints.</li>
<li><b>RNAV (GPS) minimums:</b>
<ul><li><b>LPV</b>: WAAS, <b>DA</b>, as low as 200 ft HAT, with ILS-like angular guidance. Classified as <b>APV</b>.</li>
<li><b>LNAV/VNAV</b>: <b>DA</b>. Needs WAAS or approved baro-VNAV (check temperature limits).</li>
<li><b>LP</b>: WAAS lateral only, <b>MDA</b>.</li>
<li><b>LNAV</b>: lateral only, <b>MDA</b>, any IFR-approved GPS. <b>LNAV+V</b> is advisory glidepath only, so you still have to respect the MDA and stepdowns.</li></ul></li>
<li><b>Approach classes:</b> Precision (ILS, GLS, PAR). APV (LPV, LNAV/VNAV). Nonprecision (LNAV, LP, LOC, VOR, NDB, ASR).</li>
<li><b>T-routes</b> (low) and <b>Q-routes</b> (high). <b>Fly-by</b> waypoints use turn anticipation. <b>Fly-over</b> waypoints (circled) must be crossed.</li>
</ul>

TOPICS.push({id:"hold", name:"Holding", icon:"🔁", notes:`
<h3>Standard pattern</h3>
<ul>
<li><b>Right turns</b>, with <b>1-minute inbound legs at or below 14,000 MSL</b> and <b>1½ minutes above 14,000 MSL</b>. DME/RNAV holds may use leg lengths in NM.</li>
<li>Adjust the <b>outbound</b> time to get the right <b>inbound</b> time. Start outbound timing <b>over or abeam the fix, whichever comes later</b>. If you can't tell when you're abeam, start when the turn to outbound is complete.</li>
<li>Bank: <b>3°/sec, 30°, or 25° with a flight director, whichever needs the least bank</b>.</li>
<li><b>Wind correction:</b> use <b>3× the inbound WCA</b> outbound, on the opposite side. Adjust outbound time about 1 second per knot of headwind or tailwind.</li>
</ul>
<h3>Maximum holding airspeeds</h3>
<table><tr><th>Altitude (MSL)</th><th>Max KIAS</th></tr>
<tr><td>Minimum holding altitude – 6,000</td><td><b>200</b></td></tr>
<tr><td>6,001 – 14,000</td><td><b>230</b></td></tr>
<tr><td>14,001 and above</td><td><b>265</b></td></tr></table>
<p>Exceptions: some patterns are restricted to 210 KIAS (an icon on the chart), Navy fields allow 230, and USAF fields allow 310 unless otherwise published. Start slowing down <b>within 3 minutes</b> before reaching the fix.</p>
<h3>Entries</h3>
<p>Draw a line through the fix, angled <b>70°</b> to the inbound course on the holding side:</p>
<ul>
<li><b>Direct</b> (180° sector): cross the fix and turn in the holding direction onto the outbound leg.</li>
<li><b>Parallel</b> (110° sector, <b>non-holding side</b>): cross the fix, turn to fly <b>parallel to the inbound course, outbound, on the non-holding side</b> for 1 minute, then turn <b>toward the holding side</b> (more than 180°) and intercept the inbound course or go to the fix.</li>
<li><b>Teardrop</b> (70° sector, <b>holding side</b>): cross the fix, fly outbound on a heading about <b>30° from the outbound course, into the holding side</b>, for 1 minute, then turn in the holding direction to intercept the inbound course.</li>
<li><b>Heading rule of thumb (standard right-turn hold):</b> compare your heading to the fix with the <b>outbound</b> course. Up to <b>70° to the right</b> of the outbound course means <b>teardrop</b>. Up to <b>110° to the left</b> means <b>parallel</b>. Anything else is <b>direct</b>. For a left-turn hold, mirror it (70° left = teardrop, 110° right = parallel). Example: inbound 360°, outbound 180°. Heading 200° → teardrop, 120° → parallel, 300° → direct. The AIM entries are <i>recommended</i>. The goal is to stay in protected airspace.</li>
</ul>
<h3>Holding clearance (AIM 5-3-8)</h3>
<ol>
<li><b>Direction</b> of the hold from the fix</li>
<li>Holding <b>fix</b></li>
<li><b>Radial, course, bearing, airway, or route</b></li>
<li><b>Leg length</b> in NM (DME/RNAV) or minutes, if nonstandard</li>
<li><b>Direction of turns</b> if left turns</li>
<li><b>EFC time</b> and any additional delay information</li>
</ol>
<ul>
<li>ATC should issue holding instructions at least <b>5 minutes</b> before you reach the clearance limit.</li>
<li>Arrive at the clearance limit with no holding instructions: <b>hold as published</b>. If none is published, hold on the inbound course you arrived on, with <b>right turns</b>, and request further clearance.</li>
<li>Report the <b>time and altitude reaching</b> the holding fix and report <b>leaving</b> it.</li>
<li><b>Hold-in-lieu of procedure turn (HILPT):</b> one circuit to reverse course. Additional circuits need ATC approval. Don't fly it if you're vectored to final or on a NoPT route.</li>
</ul>
`});
TOPICS.push({id:"appr", name:"Instrument Approaches", icon:"🛬", notes:`
<h3>Segments and terms</h3>
<ul>
<li><b>Feeder</b> → <b>Initial</b> (IAF to IF; may include a procedure turn or DME arc) → <b>Intermediate</b> (IF to FAF; configure) → <b>Final</b> (FAF to MAP or DA) → <b>Missed</b>.</li>
<li><b>Precision</b> (ILS, GLS, PAR) uses a <b>DA/DH</b>. <b>APV</b> (LPV, LNAV/VNAV) uses a <b>DA</b>. <b>Nonprecision</b> (LOC, VOR, NDB, LNAV, LP, ASR) uses an <b>MDA</b>.</li>
<li>At <b>DA</b>, go missed if the 91.175 conditions aren't met. A slight momentary sink below DA during the go-around is normal. At the <b>MDA</b>, you may level off and fly to the <b>MAP</b> (a fix, DME, GPS waypoint, or <b>timing from the FAF</b>).</li>
<li><b>VDP</b> ("V" on the profile view): the point where a normal descent from the MDA can start. If none is published, estimate it: <b>HAT ÷ 300 = NM</b> from the threshold for a 3° path.</li>
<li><b>Stepdown fixes:</b> stay at or above each stepdown altitude until passing the fix.</li>
<li><b>Established</b> on course means within <b>half-scale deflection</b> (ILS, VOR, GPS) or <b>±5°</b> (NDB).</li>
<li>"Cleared for the approach" while on a vector or unpublished route: <b>maintain the last assigned altitude</b> until established on a published segment.</li>
</ul>
<h3>Procedure turns</h3>
<ul>
<li>A course reversal. The barbed arrow shows which side to stay on. You choose how to fly it (45°/180°, 80°/260°, etc.) <b>unless a teardrop or holding pattern is charted</b>.</li>
<li>Stay within the charted distance, usually <b>10 NM</b>. Maximum <b>200 KIAS</b>.</li>
<li><b>No procedure turn: SHARPTT</b>: <b>S</b>traight-in clearance, <b>H</b>olding in lieu already flown or a timed approach from a hold, DME <b>A</b>rc, <b>R</b>adar vectors to final, <b>P</b>ublished "NoPT," <b>T</b>imed approach from a holding fix, <b>T</b>eardrop course reversal (when charted, fly the teardrop and not a barb PT). If you're in doubt, ask ATC.</li>
</ul>
<h3>Approach categories (V<sub>REF</sub> or 1.3 V<sub>SO</sub>)</h3>
<table><tr><th>Cat</th><th>Speed</th><th>Standard circling radius</th><th>Expanded radius (≤1,000 MSL)</th></tr>
<tr><td>A</td><td>&lt;91 kt</td><td>1.3 NM</td><td>1.3 NM</td></tr>
<tr><td>B</td><td>91–120</td><td>1.5 NM</td><td>1.7 NM</td></tr>
<tr><td>C</td><td>121–140</td><td>1.7 NM</td><td>2.7 NM</td></tr>
<tr><td>D</td><td>141–165</td><td>2.3 NM</td><td>3.6 NM</td></tr>
<tr><td>E</td><td>166+</td><td>4.5 NM</td><td>4.5 NM</td></tr></table>
<p>If you'll maneuver faster than your category speed, use the <b>higher category's</b> minimums. Expanded radii (negative "C" symbol) grow with altitude.</p>
<h3>Circling</h3>
<ul>
<li>Used when the final course is <b>more than 30°</b> from the runway, a straight-in descent would be too steep, or ATC directs it. Circling-only approaches carry a letter (e.g., <b>VOR-A</b>, RNAV (GPS)-B).</li>
<li>Stay at or above the circling MDA until you're in position to land with a normal descent, and stay within the circling radius.</li>
<li><b>Lose sight of the runway while circling:</b> make an initial <b>climbing turn toward the landing runway</b>, then continue to intercept the missed approach course.</li>
</ul>
<h3>Missed approach</h3>
<ul>
<li>Go missed when there are no visual references at DA or the MAP, you're not in a position to land, you lose visual reference below DA/MDA, ATC directs it, or for safety.</li>
<li><b>Early missed approach</b>: fly the approach <b>to the MAP at or above DA/MDA</b> before turning, unless ATC says otherwise.</li>
<li>Standard missed approach climb gradient: <b>200 ft/NM</b> unless a higher one is published.</li>
<li>Report the missed approach to ATC.</li>
</ul>
<h3>Visual and contact approaches</h3>
<ul>
<li><b>Visual approach:</b> <b>ATC-assigned</b> (you can request it). It's still IFR, but <b>not an IAP</b> and has <b>no missed approach segment</b>. Reported ceiling at least <b>1,000 ft</b> and visibility at least <b>3 SM</b>. You must have the <b>airport or the preceding aircraft</b> in sight and remain clear of clouds. You're responsible for wake turbulence behind the aircraft you're following.</li>
<li><b>Contact approach:</b> <b>only the pilot can request it</b>. Requires <b>1 SM</b> flight visibility, staying <b>clear of clouds</b>, and the reasonable expectation of continuing to the airport that way. The airport must have a <b>standard or special IAP</b>. <b>You're responsible for obstacle clearance</b>. ATC separates you from other IFR and SVFR traffic.</li>
<li><b>CVFP</b> (Charted Visual Flight Procedure): uses published landmarks.</li>
</ul>
<h3>Radar approaches</h3>
<ul>
<li><b>PAR:</b> azimuth plus elevation (precision). <b>ASR:</b> azimuth only (nonprecision), with recommended altitudes each mile on request.</li>
<li><b>No-gyro approach:</b> respond immediately to "turn right" and "stop turn." Use <b>standard-rate</b> turns until turned onto final, then <b>half-standard-rate</b>.</li>
</ul>
<h3>Other</h3>
<ul>
<li><b>Side-step</b> to a parallel runway within 1,200 ft. Start as soon as possible once the runway is in sight.</li>
<li><b>Timed approaches from a holding fix:</b> require a control tower, and no procedure turn is flown.</li>
<li><b>PRM</b> approaches: brief the "Attention All Users Page."</li>
</ul>
`});

TOPICS.push({id:"atc", name:"ATC Clearances", icon:"🎧", notes:`
<h3>Clearance format: CRAFT</h3>
<ul>
<li><b>C</b>learance limit (usually the destination airport)</li>
<li><b>R</b>oute ("as filed," a SID or DP, vectors, airways)</li>
<li><b>A</b>ltitude ("climb and maintain 5,000, expect 9,000 ten minutes after departure")</li>
<li><b>F</b>requency (departure control)</li>
<li><b>T</b>ransponder code</li>
<li>Plus any <b>void time</b>, release time, or "hold for release."</li>
</ul>
<p>Example: <i>"N123AB, cleared to the Fairbanks Airport via the Anchorage Six departure, then as filed. Climb and maintain 4,000, expect 10,000 ten minutes after departure. Departure frequency 118.6, squawk 4271."</i></p>
<h3>Clearance terms</h3>
<ul>
<li><b>"Cleared as filed"</b> covers the route only. It <b>doesn't include an altitude</b>, so ATC will state it.</li>
<li><b>Void time</b> (uncontrolled field): if you're not off by the void time, tell ATC your intentions as soon as possible and <b>no later than 30 minutes</b> after. <b>"Hold for release"</b>: you can't depart until released. <b>Release time</b>: the earliest you can depart.</li>
<li><b>"At pilot's discretion"</b>: start the climb or descent whenever you like, at any rate, and you can level off temporarily. But <b>once you've reported vacating an altitude, you can't return to it</b>.</li>
<li><b>Cruise clearance:</b> you may fly at any altitude from the minimum IFR altitude up to the assigned altitude. Once you report leaving an altitude, you can't go back to it. It also authorizes an approach at the destination airport.</li>
<li><b>VFR-on-top:</b> an IFR clearance where you choose VFR altitudes, keep VFR minimums, and follow IFR rules. Not allowed in Class A.</li>
<li><b>Composite flight plan</b> (ICAO flight rules): <b>Y = IFR first, then VFR</b>. <b>Z = VFR first, then IFR</b>.</li>
<li>File IFR at least <b>30 minutes</b> before departure (recommended).</li>
<li><b>Canceling IFR:</b> at a towered airport, it closes automatically on landing. At a non-towered airport, cancel by radio or phone after landing, or in the air if you're in VMC and will stay in VMC.</li>
<li><b>Readbacks:</b> altitudes, headings, hold-short instructions, and frequencies, with your call sign. <b>If you're unsure, ask.</b></li>
<li><b>91.123:</b> don't deviate from a clearance except in an emergency or to follow a TCAS RA. Notify ATC as soon as possible. If ATC gave you priority, a written report within <b>48 hours</b> may be requested.</li>
<li><b>"Minimum fuel"</b> is an advisory, <b>not an emergency</b>. If you need priority, declare <b>MAYDAY</b> or <b>PAN-PAN</b>.</li>
<li><b>Radar terms:</b> "radar contact" (identified), "<b>resume own navigation</b>" (you navigate), "radar service terminated," and "<b>radar contact lost</b>" (resume non-radar reports).</li>
<li><b>Vectors to final:</b> normally intercepting at least <b>2 NM outside the approach gate</b>, at an angle of no more than <b>30°</b> (20° when closer).</li>
<li><b>"Expect"</b> altitudes and routes are for <b>planning and lost-comm</b> use. They don't authorize anything.</li>
<li><b>Tower En Route Control (TEC):</b> short IFR hops through approach control airspace only.</li>
</ul>
`});
TOPICS.push({id:"comm", name:"Communications", icon:"📻", notes:`
<h3>Frequencies and codes</h3>
<ul>
<li><b>121.5</b> VHF emergency (guard), <b>243.0</b> UHF emergency.</li>
<li>Transponder: <b>7500 hijack</b>, <b>7600 lost comms</b>, <b>7700 emergency</b>, 1200 VFR. Avoid passing through those codes while changing.</li>
<li>Flight Service: <b>122.2</b> (common) and RCO frequencies on the charts. Flight Watch/EFAS (122.0) was discontinued in 2015.</li>
<li>At non-towered airports, switch to CTAF when ATC says "<b>change to advisory frequency approved</b>," and self-announce.</li>
<li>Get <b>ATIS/AWOS/ASOS</b> before calling approach, and report "with information ___."</li>
</ul>
<h3>Position report format (non-radar)</h3>
<ol><li>Identification</li><li>Position</li><li>Time</li><li>Altitude or flight level</li><li>Type of flight plan (not needed with ARTCC or approach)</li><li>ETA and name of the next reporting point</li><li>Name only of the following reporting point</li><li>Pertinent remarks</li></ol>
<h3>Lost communication tips</h3>
<ul>
<li>Check volume, squelch, mic and headset jacks, frequency, the audio panel, and the backup radio. Try the last frequency or the next sector.</li>
<li>Squawk <b>7600</b> and follow <b>91.185</b> (AVEF route, highest of MEA/Expected/Assigned altitude).</li>
<li><b>Light gun signals:</b> steady green = cleared to land (air) / take off (ground). Flashing green = return for landing (air) / cleared to taxi. Steady red = give way and keep circling (air) / stop. Flashing red = airport unsafe, don't land (air) / taxi clear of the runway. Flashing white = return to starting point (ground). Alternating red/green = use extreme caution.</li>
</ul>
<h3>Phraseology</h3>
<ul>
<li><b>Wilco</b> = received, understood, will comply. <b>Roger</b> = received only. <b>Unable</b>, <b>Say again</b>, <b>Verify</b>, <b>Standby</b>.</li>
<li>Altitudes: "one zero thousand five hundred." Flight levels: "flight level two three zero."</li>
<li>On each new frequency, give your call sign, current altitude, and the assigned altitude if you're climbing or descending ("Cessna 123AB, three thousand two hundred climbing to five thousand").</li>
</ul>
`});

TOPICS.push({id:"aero", name:"Aeromedical & Spatial Disorientation", icon:"🧠", notes:`
<h3>Vestibular system</h3>
<ul>
<li><b>Semicircular canals</b> sense <b>angular acceleration</b> (roll, pitch, yaw). After about 20 seconds in a constant turn, the fluid stops moving and the sensation fades. Rates under about <b>2°/sec</b> aren't sensed.</li>
<li><b>Otolith organs</b> sense <b>linear acceleration and gravity</b>, and can't tell tilt from acceleration.</li>
<li>The fix for spatial disorientation is to <b>believe and cross-check the instruments</b>, avoid sudden head movements, and stay proficient.</li>
</ul>
<h3>Vestibular illusions</h3>
<ul>
<li><b>The leans</b> (most common): after rolling level from a gradual, prolonged turn, you feel banked the other way and lean back toward the original turn.</li>
<li><b>Coriolis illusion</b> (most overwhelming): a quick head movement during a prolonged constant-rate turn feels like rotation about a different axis. Keep your head still while turning.</li>
<li><b>Graveyard spiral:</b> a prolonged coordinated turn feels like level flight. You lose altitude, pull back, and tighten the spiral.</li>
<li><b>Graveyard spin:</b> after recovering from a spin, you feel a spin the other way and re-enter the original spin.</li>
<li><b>Somatogravic illusion:</b> rapid <b>acceleration</b> (takeoff or go-around) feels like a <b>nose-up</b> attitude, so you push the nose down. Deceleration feels like nose-down.</li>
<li><b>Inversion illusion:</b> an abrupt climb-to-level transition feels like tumbling backward, so you push forward.</li>
<li><b>Elevator illusion:</b> an updraft feels like a climb, so you push the nose down. A downdraft feels like a descent, so you pull up.</li>
</ul>
<h3>Visual illusions</h3>
<ul>
<li><b>False horizon</b> (sloping clouds or ground lights). <b>Autokinesis</b>: a fixed light in the dark seems to move.</li>
<li><b>Landing illusions:</b> a <b>narrow</b> runway makes you feel high, so you fly a <b>low</b> approach. A <b>wide</b> runway makes you feel low, so you fly high. An <b>upsloping</b> runway makes you feel high, so you go low. A <b>downsloping</b> runway makes you go high. <b>Rain on the windscreen</b> makes you feel higher, so you go low. <b>Haze</b> makes things look farther away, so you go low. <b>Featureless terrain</b> (water, snow, a dark "black hole") makes you feel higher, so you go low. Penetrating <b>fog</b> can feel like pitching up, so you steepen.</li>
<li><b>Flicker vertigo:</b> flicker at 4–20 per second (propeller or strobes).</li>
</ul>
<h3>Hypoxia</h3>
<ul>
<li><b>Hypoxic:</b> low O<sub>2</sub> pressure (altitude).</li>
<li><b>Hypemic:</b> blood can't carry O<sub>2</sub> (<b>carbon monoxide</b>, anemia, blood loss).</li>
<li><b>Stagnant:</b> poor circulation (G-forces, cold).</li>
<li><b>Histotoxic:</b> cells can't use O<sub>2</sub> (<b>alcohol, drugs</b>).</li>
<li>Symptoms include euphoria, poor judgment, headache, cyanosis, tunnel vision, and drowsiness. <b>Time of useful consciousness</b> drops with altitude. 100% oxygen brings fast recovery.</li>
<li><b>CO poisoning:</b> heater off, fresh air, oxygen, land.</li>
</ul>
<h3>Other factors</h3>
<ul>
<li><b>Hyperventilation:</b> too little CO<sub>2</sub>. Symptoms resemble hypoxia. Slow your breathing or talk out loud.</li>
<li><b>Alcohol (91.17):</b> <b>8 hours bottle-to-throttle</b>, <b>under 0.04 BAC</b>, and not under the influence.</li>
<li><b>Scuba (AIM 8-1-2):</b> after a dive with no controlled ascent, wait 12 hours before flying up to 8,000 ft. Wait 24 hours above 8,000 ft or after a dive that required a controlled ascent (decompression stops).</li>
<li><b>Night vision:</b> about <b>30 minutes</b> to dark-adapt. Use <b>off-center</b> scanning, since the rods are off the center of vision.</li>
<li><b>IMSAFE:</b> Illness, Medication, Stress, Alcohol, Fatigue, Emotion/Eating.</li>
<li><b>Hazardous attitudes and antidotes:</b> Anti-authority ("Follow the rules"), Impulsivity ("Not so fast, think first"), Invulnerability ("It could happen to me"), Macho ("Taking chances is foolish"), Resignation ("I'm not helpless").</li>
<li><b>PAVE</b> (Pilot, Aircraft, enVironment, External pressures), <b>3P</b> (Perceive, Process, Perform), <b>DECIDE</b>.</li>
</ul>
`});

F("inst","Effect of using the alternate static source (in the cabin)?","Altimeter reads slightly high, ASI reads high, and the VSI shows a momentary climb. Cabin pressure is lower than outside.");
F("inst","\"High to low, look out below\" means?","Flying from high to low pressure or temperature without resetting the altimeter puts you LOWER than indicated.");
F("inst","Altimeter preflight accuracy check?","With the current altimeter setting, it should read within ±75 ft of the known field elevation.");
F("inst","How often should you align the heading indicator with the compass?","About every 15 minutes, in straight-and-level unaccelerated flight. Up to 3° of precession in 15 minutes is acceptable.");
F("inst","Two properties of a gyroscope?","Rigidity in space and precession.");
F("inst","What does the turn coordinator show vs. a turn-and-slip indicator?","The turn coordinator shows rate of roll AND rate of turn. The turn-and-slip shows rate of turn only. Neither shows bank angle.");
F("inst","Standard-rate turn and approximate bank angle?","3° per second (360° in 2 minutes). Bank ≈ TAS/10 + 7 (e.g., 120 kt → about 19°).");
F("inst","Compass turning error mnemonic (Northern Hemisphere)?","UNOS: Undershoot North, Overshoot South (roll out early when turning to north and late when turning to south).");
F("inst","Compass acceleration error mnemonic?","ANDS: Accelerate North, Decelerate South (on east or west headings).");
F("inst","Which altimeter setting do you use at or above 18,000 MSL?","29.92 inHg (standard). Below 18,000, use a station within 100 NM (91.121).");
F("inst","A glass cockpit ADC fails. What do you lose?","Air data: airspeed, altitude, vertical speed (red X's). Attitude from the AHRS still works, so use the standby instruments.");
// aif
F("aif","Three fundamental skills of attitude instrument flying?","Instrument cross-check, instrument interpretation, aircraft control.");
F("aif","Primary pitch instrument in straight-and-level flight?","Altimeter.");
F("aif","Primary bank instrument in straight-and-level flight?","Heading indicator.");
F("aif","Primary power instrument in straight-and-level flight?","Airspeed indicator.");
F("aif","Primary bank instrument in an established standard-rate turn?","Turn coordinator (turn-and-slip indicator).");
F("aif","Primary pitch instrument in a constant-AIRSPEED climb?","Airspeed indicator (power is set to climb power, primary = tach/MP).");
F("aif","Primary pitch instrument in a constant-RATE climb?","VSI (and the ASI is primary for power).");
F("aif","Which instrument is primary during transitions (entering a turn or climb)?","The attitude indicator. It's the only one that shows pitch and bank directly.");
F("aif","Three common scan errors?","Fixation, omission, emphasis.");
F("aif","How far ahead should you lead a level-off from a climb or descent?","About 10% of the vertical speed (50 ft early at 500 fpm).");
F("aif","Control and performance method: which are the control instruments?","Attitude indicator and power instruments (tach/MP). The performance instruments are the altimeter, ASI, VSI, HI, and TC.");
F("aif","Nose-HIGH unusual attitude recovery?","Add power, lower the nose, level the wings (coordinated), then return to the original attitude.");
F("aif","Nose-LOW unusual attitude recovery?","Reduce power, level the wings, then smoothly raise the nose to level flight.");
F("aif","Partial panel: how do you make a 90° turn without the HI?","A timed standard-rate turn: 30 seconds for 90° (3°/sec), then check the magnetic compass once it settles.");
// regs
F("regs","Instrument currency (61.57(c))?","Within 6 calendar months: 6 approaches, holding procedures and tasks, intercepting and tracking courses (\"6 HIT\").");
F("regs","When do you need an IPC?","When you've let currency lapse and the extra 6-calendar-month grace period has also expired (12 calendar months without meeting 61.57(c)).");
F("regs","IFR fuel requirement (91.167, airplane)?","Fuel to the destination, then to the alternate (if required), then 45 minutes at normal cruise.");
F("regs","When is an alternate NOT required (1-2-3 rule)?","When the destination has an IAP AND, from 1 hr before to 1 hr after ETA, the forecast is a ceiling ≥ 2,000 ft and visibility ≥ 3 SM.");
F("regs","Standard alternate minimums: precision approach?","600 ft ceiling and 2 SM visibility.");
F("regs","Standard alternate minimums: nonprecision approach?","800 ft ceiling and 2 SM visibility.");
F("regs","Alternate airport with NO instrument approach?","The forecast must allow descent from the MEA, approach, and landing under basic VFR.");
F("regs","VOR check: how recent for IFR?","Within the preceding 30 days (91.171).");
F("regs","VOR check tolerances?","VOT ±4°, ground checkpoint ±4°, airborne checkpoint ±6°, dual VORs within 4° of each other.");
F("regs","VOR check logbook entry (DEPS)?","Date, Error (bearing error), Place, Signature.");
F("regs","IFR equipment mnemonic (91.205(d))?","GRABCARD: Generator/alternator, Radios, Altimeter (sensitive), Ball, Clock, Attitude indicator, Rate-of-turn indicator, Directional gyro.");
F("regs","What's required at FL240 and above if you're using VORs?","DME or a suitable RNAV system (91.205(e)).");
F("regs","Altimeter/static system and encoder check interval for IFR?","24 calendar months (91.411).");
F("regs","Transponder check interval?","24 calendar months (91.413).");
F("regs","Lost comm ROUTE (AVEF)?","Assigned, Vectored (direct to the fix in the vector clearance), Expected, Filed.");
F("regs","Lost comm ALTITUDE?","The HIGHEST of: MEA (minimum IFR altitude), Expected altitude, Assigned altitude, for each route segment.");
F("regs","Lost comm in VFR conditions?","Continue VFR and land as soon as practicable.");
F("regs","Lost comm: when do you start the approach if the clearance limit is an IAF?","As close as possible to the EFC time. If there's no EFC, as close as possible to the ETA from the filed or amended ETE.");
F("regs","Visual references allowing descent below DA/MDA (91.175)?","Approach lights; threshold, threshold markings, or threshold lights; REIL; VASI; TDZ, TDZ markings, or TDZ lights; runway, runway markings, or runway lights.");
F("regs","Approach lights alone: how low can you go?","No lower than 100 ft above TDZE unless the red terminating bars or red side row bars are also distinctly visible.");
F("regs","Part 91 takeoff minimums?","None legally. Standard takeoff minimums (1 SM for 1–2 engines, ½ SM for more) apply to Parts 121, 125, 129, and 135.");
F("regs","IFR minimum altitude where none is published?","2,000 ft above the highest obstacle within 4 NM (mountainous areas) or 1,000 ft elsewhere (91.177).");
F("regs","IFR cruising altitudes in uncontrolled airspace (91.179)?","Magnetic course 0–179°: odd thousands. 180–359°: even thousands.");
F("regs","Supplemental oxygen rule (91.211)?","Crew: above 12,500 to 14,000 ft for more than 30 minutes; continuously above 14,000 ft. All occupants must be provided O₂ above 15,000 ft.");

// air
F("air","Class A airspace limits and requirements?","18,000 MSL to FL600. IFR only, instrument-rated pilot, clearance, ADS-B Out, altimeter on 29.92.");
F("air","Class E VFR minimums below 10,000 MSL?","3 SM; 500 ft below, 1,000 ft above, 2,000 ft horizontal.");
F("air","Class E VFR minimums at or above 10,000 MSL?","5 SM; 1,000 ft below, 1,000 ft above, 1 SM horizontal.");
F("air","Vertical limits of a Victor airway?","1,200 ft AGL up to (but not including) 18,000 MSL, 4 NM either side of centerline (Class E).");
F("air","Special VFR requirements?","1 SM flight visibility, clear of clouds, below 10,000 MSL in a surface area. At night: instrument rating and an IFR-equipped aircraft.");
F("air","VFR-on-top: what altitudes and minimums?","VFR cruising altitudes (odd/even thousands + 500) and VFR visibility and cloud clearance, while following IFR rules. Not in Class A.");
F("air","RVR 2400 equals what visibility?","½ SM.");
F("air","RVR 1600 / 4000 / 5000 equal?","¼ SM / ¾ SM / 1 SM.");
F("air","Are there weather minimums for IFR en route?","No, but you need a clearance in controlled airspace.");
F("air","Where is ADS-B Out required?","Class A, B, C; inside the 30 NM Mode C veil; above the ceiling of B/C within their lateral limits (up to 10,000 MSL); and above 10,000 MSL except at or below 2,500 AGL.");
// wx
F("wx","Three ingredients for a thunderstorm?","Sufficient moisture, an unstable lapse rate, and a lifting action.");
F("wx","What marks the start of a thunderstorm's mature stage?","Precipitation reaching the surface.");
F("wx","How far should you stay from severe thunderstorms?","At least 20 NM.");
F("wx","Two requirements for structural icing?","Visible moisture and an airframe temperature at or below 0°C.");
F("wx","Ice pellets at the surface indicate what?","Freezing rain at a higher altitude (a temperature inversion, with warmer air aloft).");
F("wx","Clear ice vs. rime ice?","Clear: large drops, freezes slowly, smooth, heavy (worst). Rime: small drops, freezes instantly, rough and milky, colder temperatures.");
F("wx","Radiation fog forms under what conditions?","Clear, calm (under 5 kt) nights, moist air, low-lying terrain.");
F("wx","Advection fog?","Moist air moving over a colder surface (coastal). Can persist in winds up to about 15 kt.");
F("wx","Which layers count as a ceiling?","The lowest BKN or OVC layer, or vertical visibility (VV) into an obscuration.");
F("wx","TAF coverage area and usual valid period?","5 SM radius of the airport center, 24 or 30 hours.");
F("wx","PIREP codes UA vs. UUA?","UA = routine, UUA = urgent.");
F("wx","AIRMET Sierra / Tango / Zulu?","Sierra: IFR and mountain obscuration. Tango: moderate turbulence, sustained surface winds ≥ 30 kt, LLWS. Zulu: moderate icing and freezing level.");
F("wx","Status of CONUS text AIRMETs?","Retired in January 2025. The CONUS uses G-AIRMETs (3-hour snapshots). Alaska and Hawaii still issue text AIRMETs.");
F("wx","SIGMET criteria (non-convective)?","Severe icing (not from thunderstorms), severe or extreme turbulence or CAT, dust or sandstorms below 3 SM, volcanic ash.");
F("wx","Convective SIGMET issue time and validity?","Hourly at H+55, valid 2 hours.");
F("wx","Winds aloft code 7325?","230° at 125 kt (code > 50: subtract 50 from the direction, add 100 to the speed).");
F("wx","Estimate the cloud base from a 10°C temp/dewpoint spread.","About 4,000 ft AGL (spread ÷ 2.5 × 1,000).");
F("wx","Why shouldn't you use cockpit datalink NEXRAD to pick through storms?","The image can be 15–20 minutes older than the timestamp suggests. Use it for strategic avoidance only.");
// charts
F("charts","What does an MEA guarantee?","Navigation signal coverage and obstacle clearance between fixes.");
F("charts","What does a MOCA guarantee?","Obstacle clearance for the whole segment, but nav coverage only within 22 NM of the VOR. Marked with *.");
F("charts","MRA vs. MCA?","MRA: lowest altitude to identify an intersection. MCA: lowest altitude to cross a fix before climbing to a higher MEA.");
F("charts","Solid vs. open triangle on an en route chart?","Solid = compulsory reporting point (non-radar). Open = on request.");
F("charts","ODP vs. SID?","ODP = obstacle clearance only; can be flown without an ATC assignment. SID = obstacle clearance plus ATC efficiency; needs a clearance.");
F("charts","Diverse departure assumptions?","Climb to 400 ft above airport elevation before turning, at a 200 ft/NM gradient or more.");
F("charts","Convert 400 ft/NM at 90 kt groundspeed to fpm.","400 × 90 ÷ 60 = 600 fpm.");
F("charts","MSA: obstacle clearance and radius?","1,000 ft within 25 NM of the navaid or waypoint (emergency use).");
F("charts","Maltese cross vs. lightning bolt on the profile view?","Maltese cross = FAF for nonprecision. Lightning bolt = glideslope or glidepath intercept (the FAF for precision).");
F("charts","Black triangle 'A' / 'T'?","A = nonstandard alternate minimums (A NA = not authorized). T = nonstandard takeoff minimums or a departure procedure.");
F("charts","HAT vs. HAA?","HAT = height above touchdown (straight-in). HAA = height above airport (circling).");
F("charts","What does a 'descend via' clearance NOT include?","Approach clearance. You still need to be cleared for the approach.");
F("charts","Five sections of an approach chart?","Pilot briefing info, plan view, profile view, minimums, airport sketch.");
// nav
F("nav","VOR CDI full-scale deflection and value per dot?","10° full scale, 2° per dot (5 dots).");
F("nav","Localizer frequency range?","108.10–111.95 MHz, odd tenths only.");
F("nav","Localizer width and sensitivity vs. a VOR?","3–6° wide (700 ft at the threshold), about 4× more sensitive than a VOR.");
F("nav","Localizer coverage?","18 NM within ±10° of course, and 10 NM within ±35°.");
F("nav","ILS: three groups of components?","Guidance (LOC and GS), range (markers, DME, fixes), visual (ALS and runway lights).");
F("nav","Glideslope thickness and frequency band?","About 1.4° (±0.7°). UHF 329.15–335.00 MHz.");
F("nav","3° glideslope descent rate rule?","Groundspeed × 5 (e.g., 100 kt → about 500 fpm).");
F("nav","Outer, middle, inner marker colors?","OM blue (dashes), MM amber (dot-dash), IM white (dots).");
F("nav","DME slant-range error is negligible when?","At least 1 NM from the station for every 1,000 ft of altitude.");
F("nav","ADF formula?","MH + RB = MB (magnetic bearing to the station).");
F("nav","Satellites needed for RAIM? For FDE?","5 for RAIM (fault detection), 6 for FDE (or 5 plus baro-aiding).");
F("nav","GPS CDI scaling en route / terminal / approach?","±5 NM (±2 NM on many WAAS units) / ±1 NM within 30 NM / ±0.3 NM (from 2 NM before the FAF).");
F("nav","LPV vs. LNAV minimums?","LPV: WAAS vertical guidance to a DA (as low as 200 ft). LNAV: lateral only, MDA.");
F("nav","What is LNAV+V?","Advisory vertical guidance on an LNAV approach. You still have to comply with the MDA and stepdowns.");
F("nav","What does a VOR with no Morse identifier mean?","It's under maintenance and may be unreliable. Don't use it.");
F("nav","GPS substitution limit for ADF and DME?","GPS can replace ADF and DME except for lateral guidance on the final approach course of an NDB or VOR approach not titled 'or GPS'.");
F("nav","Common NDB/ADF errors?","Thunderstorm, night effect, terrain, shoreline, bank (dip) error.");

// hold
F("hold","Standard holding pattern?","Right turns, 1-minute inbound legs at or below 14,000 MSL (1½ minutes above 14,000).");
F("hold","Max holding speed up to 6,000 MSL?","200 KIAS.");
F("hold","Max holding speed 6,001–14,000 MSL?","230 KIAS (210 where an icon shows it).");
F("hold","Max holding speed above 14,000 MSL?","265 KIAS.");
F("hold","When do you start outbound timing?","Over or abeam the fix, whichever occurs later. If you can't tell when you're abeam, when the turn to outbound is complete.");
F("hold","Outbound wind correction in a hold?","Three times the inbound wind correction angle, applied the opposite way.");
F("hold","Three holding entries and sector sizes?","Direct (180°), Parallel (110°, non-holding side), Teardrop (70°, holding side).");
F("hold","Teardrop entry procedure?","Cross the fix, fly outbound about 30° off the reciprocal toward the holding side for 1 minute, then turn in the holding direction to intercept inbound.");
F("hold","Parallel entry procedure?","Cross the fix, fly parallel to the outbound course on the non-holding side for 1 minute, turn toward the holding side to intercept inbound or return to the fix.");
F("hold","Elements of a holding clearance?","Direction from the fix, fix, radial/course, leg length (if DME/RNAV), direction of turns (if left), EFC time.");
F("hold","No holding instructions on reaching the clearance limit?","Hold as published. If none is published, hold on the course you arrived on with right turns, and ask for further clearance.");
F("hold","When should you slow to holding speed?","Within 3 minutes before reaching the holding fix.");
F("hold","Bank angle in holding?","3°/sec, 30°, or 25° with a flight director, whichever needs the least bank.");
F("hold","Reports required in holding?","Time and altitude when reaching the holding fix, and when leaving it.");
// appr
F("appr","DA vs. MDA?","DA (precision/APV): go missed at DA if not visual. MDA (nonprecision): don't descend below it, but you may level off and fly to the MAP.");
F("appr","Approach category is based on?","VREF, or 1.3 × VSO at max landing weight. A < 91, B 91–120, C 121–140, D 141–165, E 166+ kt.");
F("appr","When should you NOT fly a procedure turn (SHARPTT)?","Straight-in, Holding in lieu, Arc, Radar vectors, NoPT, Timed approach from a hold, Teardrop. Unless ATC clears it.");
F("appr","Max speed in a procedure turn and typical distance limit?","200 KIAS. Within 10 NM (as charted).");
F("appr","Lose visual reference while circling?","Make a climbing turn toward the landing runway, then intercept the missed approach course.");
F("appr","Early missed approach (before the MAP)?","Fly the approach course to the MAP at or above the MDA/DA, then fly the published missed approach (unless ATC directs otherwise).");
F("appr","Visual approach requirements?","ATC-initiated; ceiling ≥ 1,000 ft, visibility ≥ 3 SM; airport or preceding aircraft in sight; clear of clouds. No missed approach segment.");
F("appr","Contact approach requirements?","Pilot must request it; 1 SM flight visibility; clear of clouds; expect to reach the airport; the airport must have an IAP. Pilot handles obstacle clearance.");
F("appr","No-gyro approach turn rates?","Standard rate until on final, then half-standard rate on final.");
F("appr","Standard circling radius, Category A and B?","A: 1.3 NM; B: 1.5 NM (standard). Expanded (negative C, ≤1,000 MSL): A 1.3, B 1.7.");
F("appr","Why is an approach named 'VOR-A'?","The letter means circling-only minimums (the final approach course isn't aligned within 30° or the descent gradient is too steep).");
F("appr","What does 'established' mean on an approach?","Within half-scale deflection (ILS, VOR, GPS) or ±5° (NDB).");
F("appr","Cleared for the approach while on a vector. What altitude?","Maintain the last assigned altitude until established on a published segment of the approach.");
F("appr","How do you estimate a VDP?","HAT ÷ 300 = distance in NM from the threshold (3° path).");
F("appr","Glideslope inop on an ILS?","Fly it as a localizer approach using the LOC (MDA) minimums.");
F("appr","Standard missed approach climb gradient?","200 ft/NM unless a higher gradient is published.");
// atc
F("atc","Clearance mnemonic?","CRAFT: Clearance limit, Route, Altitude, Frequency, Transponder.");
F("atc","Does 'cleared as filed' include the altitude?","No, only the route. ATC will state the altitude.");
F("atc","Clearance void time missed. What now?","Notify ATC of your intentions as soon as possible, and no later than 30 minutes after the void time.");
F("atc","'At pilot's discretion' climb/descent rules?","Start when you want, at any rate, and level off temporarily, but don't return to an altitude you've reported vacating.");
F("atc","What does a cruise clearance authorize?","Any altitude from the minimum IFR altitude up to the assigned altitude, plus an approach at the destination. Once you report leaving an altitude, you can't return to it.");
F("atc","'Minimum fuel' vs. emergency?","Minimum fuel is an advisory (you can accept little or no delay). It isn't an emergency, and it doesn't get priority.");
F("atc","Composite flight plan Y vs. Z?","Y = IFR first, then VFR. Z = VFR first, then IFR.");
F("atc","What does 'resume own navigation' mean?","Radar vectors are over. You're responsible for your own navigation.");
F("atc","Emergency deviation from a clearance: what's required?","Notify ATC as soon as possible. If given priority, submit a report within 48 hours if requested (91.123).");
F("atc","What are 'expect' clearances for?","Planning and lost-comm procedures. They don't authorize anything.");
F("atc","How far before departure should you file IFR?","At least 30 minutes (recommended).");
F("atc","How do you cancel IFR at a non-towered airport?","By radio or phone after landing (or in the air if VMC and you'll stay VMC).");
// comm
F("comm","Transponder codes 7500 / 7600 / 7700?","Hijack / lost communications / emergency.");
F("comm","VHF emergency frequency?","121.5 MHz.");
F("comm","Common Flight Service frequency?","122.2 MHz.");
F("comm","Non-radar position report elements?","ID, position, time, altitude, type of flight plan, ETA and name of the next point, the following point, remarks.");
F("comm","Wilco vs. Roger?","Wilco = received, understood, will comply. Roger = message received.");
F("comm","Light gun: flashing red to an aircraft in flight?","Airport unsafe, don't land.");
F("comm","Light gun: steady red to an aircraft in flight?","Give way to other aircraft and continue circling.");
F("comm","Light gun: flashing green to an aircraft on the ground?","Cleared to taxi.");
F("comm","Initial call on a new frequency while climbing?","Call sign, current altitude, and the altitude you're climbing to.");
F("comm","When do you switch to CTAF inbound IFR to a non-towered airport?","When ATC says 'change to advisory frequency approved'.");
// reports
F("reports","MARVELOUS VFR C500: M?","Missed approach.");
F("reports","MARVELOUS VFR C500: A?","Airspeed change of 10 kt or 5% of TAS (whichever is greater) from the filed TAS.");
F("reports","MARVELOUS VFR C500: R (first)?","Reaching a holding fix or clearance limit (time and altitude).");
F("reports","MARVELOUS VFR C500: E?","ETA change of more than 2 minutes (non-radar).");
F("reports","MARVELOUS VFR C500: L?","Leaving a holding fix or clearance limit.");
F("reports","MARVELOUS VFR C500: O / F?","Leaving the outer marker or final approach fix inbound (non-radar).");
F("reports","MARVELOUS VFR C500: U and S?","Unforecast weather; Safety of flight information.");
F("reports","MARVELOUS VFR C500: V (second) and VFR?","Vacating an assigned altitude; VFR-on-top altitude change.");
F("reports","MARVELOUS VFR C500: R (second) and C?","Radio, nav, or approach equipment failure (91.187); Compulsory reporting points (non-radar).");
F("reports","MARVELOUS VFR C500: 500?","Unable to climb or descend at least 500 fpm.");
F("reports","What goes in a 91.187 malfunction report?","Aircraft ID, equipment affected, degree of IFR impairment, nature and extent of ATC assistance desired.");
F("reports","Which reports are only required in a non-radar environment?","ETA change > 2 min, leaving the FAF/OM inbound, compulsory reporting points.");
F("reports","NASA ASRS filing deadline?","Within 10 days of the incident or violation.");
// aero
F("aero","Most common vestibular illusion?","The leans.");
F("aero","Most overwhelming illusion?","Coriolis illusion: a head movement during a prolonged turn.");
F("aero","Somatogravic illusion?","Rapid acceleration creates a false nose-up sensation, so the pilot pushes over (dangerous on a go-around).");
F("aero","Inversion illusion?","An abrupt change from climb to level feels like tumbling backward, so the pilot pushes the nose down.");
F("aero","Graveyard spiral?","In a prolonged coordinated turn you feel level, lose altitude, pull back, and tighten the spiral.");
F("aero","What do the semicircular canals vs. otoliths sense?","Canals: angular acceleration. Otoliths: linear acceleration and gravity.");
F("aero","Narrow runway illusion?","You feel too high and fly a low approach.");
F("aero","Black-hole or featureless terrain approach illusion?","You feel higher than you are and fly a low approach.");
F("aero","Upsloping runway illusion?","You feel too high and fly a low approach.");
F("aero","Four types of hypoxia?","Hypoxic (altitude), hypemic (CO, anemia), stagnant (circulation), histotoxic (alcohol, drugs).");
F("aero","Carbon monoxide causes which type of hypoxia?","Hypemic.");
F("aero","Alcohol rule (91.17)?","8 hours bottle to throttle, BAC under 0.04, not under the influence.");
F("aero","Autokinesis?","A stationary light stared at in the dark appears to move.");
F("aero","IMSAFE?","Illness, Medication, Stress, Alcohol, Fatigue, Emotion/Eating.");
F("aero","How long does full dark adaptation take?","About 30 minutes.");

const QUIZ = [];
function Q(t,q,o,a,e){QUIZ.push({t:t,q:q,o:o,a:a,e:e});}
// inst
Q("inst","If both the ram air input and the drain hole of the pitot system are blocked, what reaction should you observe on the airspeed indicator when power is applied and a climb is initiated out of severe icing conditions?",["The indication will drop to zero.","The indication will increase as the airplane climbs.","The indication will remain constant at the airspeed when the blockage occurred."],1,"With the pitot inlet and drain both blocked, the trapped pitot pressure stays fixed while static pressure drops in the climb, so the ASI reads like an altimeter and increases.");
Q("inst","If the static port becomes blocked during a climb, the airspeed indicator will",["indicate higher than actual.","indicate lower than actual.","not change."],1,"With static pressure trapped at the higher (lower-altitude) value, the ASI sees less differential pressure in a climb and reads LOW. In a descent it reads high.");
Q("inst","When the alternate static source is selected in an unpressurized airplane, the altimeter will normally",["indicate lower than actual.","indicate higher than actual.","not be affected."],1,"Cabin pressure is slightly lower than outside static pressure because of venturi effect, so the altimeter reads higher, the ASI reads faster, and the VSI shows a momentary climb.");
Q("inst","While flying from an area of high pressure to low pressure without resetting the altimeter, the airplane's true altitude will be",["higher than indicated.","lower than indicated.","the same as indicated."],1,"\"High to low, look out below.\" The altimeter over-reads, so you're actually lower than indicated.");
Q("inst","During the preflight, with the altimeter set to the current setting, the altimeter should read within ___ of field elevation.",["±50 ft","±75 ft","±100 ft"],1,"The Instrument Flying Handbook preflight check is ±75 ft. If it's off by more, have it checked.");
