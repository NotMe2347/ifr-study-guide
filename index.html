Q("inst","What does the miniature airplane of the turn coordinator directly display?",["Rate of roll and rate of turn.","Angle of bank and rate of turn.","Angle of bank only."],0,"The canted gyro senses both roll and yaw, so it shows rate of roll and then rate of turn. It doesn't show bank angle.");
Q("inst","What is the approximate angle of bank for a standard-rate turn at 120 knots TAS?",["12°","19°","24°"],1,"TAS/10 + 7 = 12 + 7 = 19°.");
Q("inst","In the Northern Hemisphere, when turning to a northerly heading using the magnetic compass, you should roll out",["before the compass reaches the desired heading.","after the compass passes the desired heading.","when the compass shows the desired heading."],0,"UNOS: Undershoot North. The compass lags when turning to north, so you lead the rollout.");
Q("inst","On an easterly heading in the Northern Hemisphere, accelerating causes the magnetic compass to indicate",["a turn toward north.","a turn toward south.","no change."],0,"ANDS: Accelerate North, Decelerate South.");
Q("inst","How often should the heading indicator be checked against the magnetic compass?",["Every 5 minutes.","About every 15 minutes.","Only before takeoff."],1,"The heading indicator precesses. Check and reset it about every 15 minutes in straight-and-level, unaccelerated flight.");
Q("inst","A blocked static system will cause the vertical speed indicator to",["show a climb.","show a descent.","indicate zero."],2,"With no change in static pressure, there's no differential across the VSI's calibrated leak, so it reads zero.");
// aif
Q("aif","What are the three fundamental skills involved in attitude instrument flying?",["Instrument interpretation, trim application, and aircraft control.","Cross-check, instrument interpretation, and aircraft control.","Cross-check, emphasis, and aircraft control."],1,"The IFH lists instrument cross-check, instrument interpretation, and aircraft control.");
Q("aif","Which instrument is primary for pitch in straight-and-level flight?",["Attitude indicator.","Altimeter.","Vertical speed indicator."],1,"The altimeter gives the most pertinent information about whether pitch is holding level flight.");
Q("aif","Which instrument is primary for bank in straight-and-level flight?",["Heading indicator.","Turn coordinator.","Attitude indicator."],0,"In straight flight, the heading indicator shows whether you're holding heading, so it's primary for bank.");
Q("aif","As power is reduced to change airspeed from high to low cruise in level flight, which instruments are primary for pitch, bank, and power, respectively?",["Attitude indicator, heading indicator, and tachometer/MP.","Altimeter, heading indicator, and tachometer/MP.","Altimeter, attitude indicator, and airspeed indicator."],1,"During the change, the altimeter (pitch) and HI (bank) stay primary. The power instrument is primary while you set the new power, then the ASI becomes primary once stabilized.");
Q("aif","What is the primary bank instrument once a standard-rate turn is established?",["Attitude indicator.","Turn coordinator.","Heading indicator."],1,"Once the turn is established, the turn coordinator (rate of turn) is primary for bank.");
Q("aif","During a constant-airspeed climb at full power, which instrument is primary for pitch?",["Attitude indicator.","Vertical speed indicator.","Airspeed indicator."],2,"Power is fixed, so pitch controls airspeed. The ASI is primary for pitch.");
Q("aif","Which is a common scan error in which the pilot stares at a single instrument?",["Omission.","Fixation.","Emphasis."],1,"Fixation is staring at one instrument. Omission is leaving one out of the scan. Emphasis is relying on one instrument instead of cross-checking.");
Q("aif","To level off from a 500 fpm descent at a target altitude, begin the level-off approximately",["50 ft above the altitude.","100 ft above the altitude.","at the altitude."],0,"Lead by about 10% of the vertical speed: 10% of 500 = 50 ft.");
Q("aif","Recovery from a nose-high, decreasing-airspeed unusual attitude should be to",["reduce power, raise the nose, level the wings.","add power, lower the nose, level the wings.","level the wings, raise the nose, reduce power."],1,"Nose high, slowing: add power, lower the nose to prevent a stall, and level the wings, applied almost at the same time.");
Q("aif","Recovery from a nose-low, increasing airspeed unusual attitude should be",["increase pitch, reduce power, level wings.","reduce power, level the wings, raise the nose.","level wings, add power, raise the nose."],1,"Reduce power to stop the speed buildup, level the wings so the lift vector points up, then raise the nose smoothly.");

// regs
Q("regs","To act as PIC under IFR, a pilot must have performed and logged within the preceding 6 calendar months at least",["six instrument approaches, holding procedures and tasks, and intercepting and tracking courses.","six instrument approaches and 6 hours of instrument time.","six instrument approaches, three of which must be in actual IMC."],0,"61.57(c): 6 approaches, holding procedures and tasks, and intercepting and tracking courses with electronic navigation systems.");
Q("regs","A pilot's instrument currency expired 4 calendar months ago. To regain currency, the pilot may",["only complete an IPC.","fly the required tasks with a safety pilot in simulated conditions (or in an approved sim).","fly IFR with passengers in VMC to log the tasks."],1,"You have an additional 6 calendar months to meet the 61.57(c) tasks with a safety pilot or in a sim/ATD. After that, you need an IPC.");
Q("regs","What fuel is required for an IFR flight in an airplane when an alternate is required?",["Fuel to the destination, then the alternate, plus 30 minutes.","Fuel to the destination, then the alternate, plus 45 minutes at normal cruise.","Fuel to the destination plus 45 minutes."],1,"91.167: destination plus alternate plus 45 minutes at normal cruising speed.");
Q("regs","An alternate is NOT required if the destination has a standard IAP and, for 1 hour before to 1 hour after ETA, the forecast is at least",["1,000 ft ceiling and 3 SM.","2,000 ft ceiling and 3 SM.","3,000 ft ceiling and 5 SM."],1,"The 1-2-3 rule: 1 hour either side of ETA, 2,000 ft ceiling, 3 SM visibility.");
Q("regs","For an airport with a precision approach to be listed as an alternate (standard alternate minimums), the forecast at ETA must be at least",["600 ft ceiling and 2 SM.","800 ft ceiling and 2 SM.","1,000 ft ceiling and 3 SM."],0,"91.169(c): precision approach is 600-2; nonprecision is 800-2.");
Q("regs","For an alternate with only a nonprecision approach (standard minimums), the forecast must be at least",["600 ft and 2 SM.","800 ft and 2 SM.","800 ft and 3 SM."],1,"Nonprecision standard alternate minimums are an 800 ft ceiling and 2 SM.");
Q("regs","If no instrument approach is available at the alternate airport, the forecast weather at ETA must allow",["descent from the MEA, approach, and landing under basic VFR.","a 1,000 ft ceiling and 3 SM visibility.","a 2,000 ft ceiling and 3 SM visibility."],0,"91.169(c)(2): the ceiling and visibility must allow descent from the MEA, approach, and landing under basic VFR.");
Q("regs","When using a VOT, the CDI should center within ±4° with the OBS set to",["0° FROM or 180° TO.","180° FROM or 0° TO.","any radial."],0,"A VOT transmits the 360° radial in all directions, so center at 0° FROM or 180° TO, within ±4°.");
Q("regs","What is the maximum permissible bearing error for an airborne VOR check over a designated airborne checkpoint?",["±4°","±6°","±8°"],1,"Airborne checkpoint: ±6°. VOT and ground checkpoints are ±4°.");
Q("regs","For IFR operations, the VOR receiver must have been checked within the preceding",["10 days.","30 days.","24 calendar months."],1,"91.171: within 30 days.");
Q("regs","Which is NOT required in a VOR check log entry?",["Date and place.","Bearing error.","Frequency of the VOR used."],2,"The entry is DEPS: Date, Error, Place, Signature.");
Q("regs","Which is required equipment for IFR flight under 91.205(d)?",["Slip-skid indicator and a clock with a sweep-second pointer or digital presentation.","DME and an autopilot.","Pitot heat and a second VOR receiver."],0,"GRABCARD includes the Ball (slip-skid) and a Clock showing hours, minutes, and seconds. Pitot heat, DME (below FL240), and a second VOR aren't required by 91.205.");
Q("regs","At or above what altitude is DME (or suitable RNAV) required when VOR navigation equipment is required?",["FL180","FL240","12,500 MSL"],1,"91.205(e): FL240 and above.");
Q("regs","To fly IFR in controlled airspace, the altimeter/static system and altitude reporting equipment must have been tested within",["12 calendar months.","24 calendar months.","30 days."],1,"91.411: 24 calendar months.");
Q("regs","You lose two-way radio communications in IMC while being radar vectored. Which route should you fly?",["The filed route.","Direct to the fix, route, or airway specified in the vector clearance.","The route ATC said to expect."],1,"AVEF: if being vectored, go direct to the fix, route, or airway specified in the vector clearance.");
Q("regs","After lost comm in IMC, you were assigned 5,000; told to expect 7,000 ten minutes after departure; the MEA is 6,000. Ten minutes after departure, fly",["5,000 ft.","6,000 ft.","7,000 ft."],2,"Fly the highest of the assigned (5,000), the MEA (6,000), and the expected altitude once the expect time arrives (7,000).");
Q("regs","Lost comm, in IMC, and the clearance limit is a fix from which an approach begins. You should begin descent and the approach",["immediately upon reaching the fix.","as close as possible to the EFC, or if none, the ETA based on the filed/amended ETE.","after holding for 30 minutes."],1,"91.185(c)(3)(i).");
Q("regs","Without the red terminating bars or red side row bars visible, a pilot using only the approach light system may descend no lower than",["the DA.","100 ft above TDZE.","200 ft above TDZE."],1,"91.175(c)(3)(i): approach lights alone allow descent to 100 ft above TDZE.");
Q("regs","Which is NOT one of the 91.175 conditions to descend below DA/MDA?",["Flight visibility is not less than the visibility prescribed for the approach.","The ceiling reported by ATIS is at or above the HAT.","The aircraft is continuously in a position to land using a normal rate of descent and normal maneuvers."],1,"91.175 is about flight visibility and the visual references. Reported ceiling isn't a requirement to descend below DA/MDA.");
Q("regs","Under Part 91, what are the takeoff minimums for a single-engine airplane departing IFR?",["1 SM.","½ SM.","No takeoff minimums are prescribed."],2,"Standard takeoff minimums in 91.175(f) apply to Parts 121, 125, 129, and 135. Part 91 operators aren't bound by them (but should use good judgment and the published DPs).");
Q("regs","In a designated mountainous area with no published minimum altitude, IFR flight must be at least",["1,000 ft above the highest obstacle within 4 NM.","2,000 ft above the highest obstacle within 4 NM.","2,000 ft above the highest obstacle within 5 SM."],1,"91.177(a)(2)(i).");
Q("regs","Flying IFR in uncontrolled airspace below 18,000 MSL on a magnetic course of 135°, an appropriate altitude is",["6,000 ft.","7,000 ft.","7,500 ft."],1,"91.179: courses 0–179° use odd thousands (IFR). 7,500 would be VFR.");
// air
Q("air","Which is true about VFR-on-top?",["It's a VFR clearance above a cloud layer.","You must fly VFR cruising altitudes and keep VFR minimums while complying with IFR rules.","It's permitted in Class A airspace."],1,"VFR-on-top is an IFR clearance flown at VFR altitudes and minimums, and it isn't allowed in Class A.");
Q("air","Special VFR at night requires",["only a private pilot certificate.","an instrument rating and an aircraft equipped for IFR.","3 SM visibility."],1,"91.157: at night, the pilot must be instrument rated and current, and the aircraft IFR-equipped.");
Q("air","The basic VFR minimums in Class E airspace below 10,000 MSL are",["1 SM and clear of clouds.","3 SM; 500 below, 1,000 above, 2,000 horizontal.","5 SM; 1,000 below, 1,000 above, 1 SM horizontal."],1,"3-152 below 10,000 MSL. At or above 10,000 MSL it's 5 SM and 1,000/1,000/1 SM.");
Q("air","Federal (Victor) airways extend upward from 1,200 ft AGL to",["but not including 18,000 MSL.","14,500 MSL.","FL450."],0,"Victor airways are Class E from 1,200 AGL to but not including 18,000 MSL.");
Q("air","RVR 2400 converts to a visibility of",["¼ SM.","½ SM.","¾ SM."],1,"1600 = ¼, 2400 = ½, 4000 = ¾, 5000 = 1.");
Q("air","Class A airspace extends from",["14,500 MSL to FL600.","18,000 MSL to and including FL600.","FL180 to FL450."],1,"Class A: 18,000 MSL up to and including FL600.");
Q("air","An IFR flight in Class G airspace",["needs an ATC clearance.","doesn't need an ATC clearance, but needs an instrument rating to fly in IMC.","is prohibited."],1,"91.173 requires a clearance only in controlled airspace. An instrument rating is required for IFR or flight below VFR minimums (61.3(e)).");
Q("air","How wide is a Victor airway (within 51 NM of the navaid)?",["2 NM each side of centerline.","4 NM each side of centerline.","8 NM total, 6 NM each side beyond 51 NM."],1,"4 NM either side of centerline (8 NM total).");

// wx
Q("wx","Which conditions are necessary for the formation of thunderstorms?",["High humidity, lifting force, and unstable conditions.","High humidity, high temperature, and cumulus clouds.","Lifting force, moist air, and extensive cloud cover."],0,"You need sufficient moisture, an unstable lapse rate, and a lifting action.");
Q("wx","The mature stage of a thunderstorm begins when",["the anvil top forms.","precipitation begins to fall from the cloud base and reaches the surface.","updrafts reach maximum speed."],1,"Precipitation reaching the surface marks the start of the mature stage, when both updrafts and downdrafts exist.");
Q("wx","Ice pellets encountered during flight normally indicate",["freezing rain at a higher altitude.","a cold front has passed.","there are thunderstorms in the area."],0,"Ice pellets form when rain freezes falling through colder air below. That means a warmer layer, and freezing rain, above.");
Q("wx","Which type of structural icing is most likely in stratiform clouds at temperatures well below freezing?",["Clear ice.","Rime ice.","Mixed ice."],1,"Small supercooled droplets in stratiform clouds freeze instantly and form rime ice.");
Q("wx","What is required for structural icing to form?",["Visible moisture and an airframe temperature at or below freezing.","Freezing rain only.","Temperatures below −20°C."],0,"Structural icing requires visible moisture (cloud, rain, drizzle) and a surface temperature at or below 0°C.");
Q("wx","Radiation fog is most likely to form",["over water on windy days.","on clear, calm nights over land with high humidity.","when moist air moves upslope."],1,"Radiation fog forms from nighttime ground cooling under clear skies with light or no wind.");
Q("wx","Advection fog forms when",["warm, moist air moves over a colder surface.","cold air moves over warm water.","the ground cools on a calm night."],0,"Advection fog is moist air moving over a cooler surface. It's common along coasts and can persist in moderate wind.");
Q("wx","Which conditions are covered by AIRMET (G-AIRMET) Sierra?",["Moderate icing and freezing level.","IFR conditions and extensive mountain obscuration.","Moderate turbulence and strong surface winds."],1,"Sierra = IFR and mountain obscuration. Tango = turbulence, winds, LLWS. Zulu = icing and freezing level.");
Q("wx","Which is a criterion for issuing a (non-convective) SIGMET?",["Moderate icing.","Severe icing not associated with thunderstorms.","Sustained surface winds of 30 kt."],1,"SIGMETs cover severe icing, severe or extreme turbulence, dust or sandstorms under 3 SM, and volcanic ash.");
Q("wx","Convective SIGMETs are issued",["hourly at H+55 and valid for 2 hours.","every 6 hours and valid for 6 hours.","only when tornadoes are reported."],0,"Convective SIGMETs are issued hourly at 55 minutes past the hour and are valid for up to 2 hours.");
Q("wx","In a METAR, which constitutes a ceiling?",["The lowest SCT layer.","The lowest BKN or OVC layer, or vertical visibility.","Any layer below 1,000 ft."],1,"A ceiling is the lowest broken or overcast layer, or vertical visibility into an obscuration.");
Q("wx","A TAF normally covers the area within",["5 SM of the airport center.","10 NM of the airport.","25 NM of the airport."],0,"TAFs cover a 5 SM radius from the center of the runway complex.");
Q("wx","A winds-aloft forecast entry for 9,000 ft reads 7735−08. The wind is",["270° at 135 kt.","770° at 35 kt (invalid).","270° at 35 kt."],0,"Direction code over 50: subtract 50 (77 − 50 = 27 → 270°) and add 100 to the speed (35 + 100 = 135 kt).");
Q("wx","Why should cockpit datalink (FIS-B) NEXRAD not be used to navigate between thunderstorm cells?",["It shows only lightning.","The image may be many minutes older than its timestamp suggests.","It only shows precipitation above FL180."],1,"Mosaic latency can be 15–20 minutes, and cells move and grow quickly. Use it for strategic avoidance only.");
// charts
Q("charts","What does the MEA ensure?",["Obstacle clearance only.","Acceptable navigation signal coverage and obstacle clearance between fixes.","Radar coverage."],1,"MEA assures nav signal coverage and obstacle clearance. MOCA assures obstacle clearance, with nav coverage only within 22 NM.");
Q("charts","When can you fly at the MOCA (when no MEA alternative applies)?",["Anywhere on the airway.","Within 22 NM of the VOR.","Only in VMC."],1,"Nav signal coverage at the MOCA is assured only within 22 NM of the VOR (91.177).");
Q("charts","A flag with an 'X' at an intersection on an en route chart shows the",["Minimum Crossing Altitude (MCA).","Minimum Reception Altitude (MRA).","Maximum Authorized Altitude."],0,"The X flag is the MCA. An R flag is the MRA.");
Q("charts","A solid triangle on an en route chart denotes a",["non-compulsory reporting point.","compulsory reporting point.","VOR changeover point."],1,"Solid = compulsory (report in non-radar). Open = on request.");
Q("charts","Which statement about ODPs and SIDs is correct?",["Both require ATC assignment.","An ODP may be flown without ATC assignment and provides obstacle clearance only.","A SID provides only obstacle clearance."],1,"ODPs provide obstacle clearance only and can be flown at the pilot's discretion. SIDs also streamline ATC and require a clearance.");
Q("charts","A DP requires a 300 ft/NM climb gradient. At 120 kt groundspeed, the required rate of climb is",["360 fpm.","600 fpm.","720 fpm."],1,"300 × 120 ÷ 60 = 600 fpm.");
Q("charts","The MSA shown on an approach chart provides",["1,000 ft obstacle clearance within 25 NM of the navaid or waypoint.","2,000 ft obstacle clearance within 30 NM.","nav signal coverage within 25 NM."],0,"MSA: 1,000 ft clearance within 25 NM, for emergency use. It doesn't guarantee nav or comm coverage.");
Q("charts","On the profile view of a nonprecision approach, the FAF is depicted by",["a lightning bolt.","a Maltese cross.","a V symbol."],1,"Maltese cross = FAF (nonprecision). Lightning bolt = glideslope intercept. V = VDP.");
Q("charts","A black triangle with an 'A' in the minimums section indicates",["the approach is not authorized at night.","nonstandard alternate minimums apply (or alternate is not authorized).","ATC approval is required."],1,"Check the alternate minimums notes in the front of the TPP (or 'A NA' = not authorized).");
Q("charts","A 'descend via' clearance on a STAR authorizes",["descent per the STAR's published restrictions, at pilot's discretion.","the instrument approach at the destination.","descent to the MVA."],0,"'Descend via' means follow the STAR's lateral path and the published altitude and speed restrictions. It isn't an approach clearance.");
Q("charts","HAA on a circling minimums line stands for",["Height Above Airport.","Height Above Approach.","Highest Approach Altitude."],0,"HAA = height above airport (circling). HAT = height above touchdown (straight-in).");

// nav
Q("nav","Full-scale deflection of a VOR CDI represents",["2.5°","5°","10°"],2,"VOR: 10° full scale, 2° per dot.");
Q("nav","Each dot on a 5-dot localizer CDI represents roughly",["0.5°","1°","2°"],0,"Full-scale localizer deflection is about 2.5° (course width 3–6°), so each dot is about 0.5°, which is 4× the VOR's sensitivity.");
Q("nav","Localizer frequencies are",["108.10–111.95 MHz, odd tenths only.","108.00–117.95 MHz, even tenths only.","329.15–335.00 MHz."],0,"Localizers use odd tenths between 108.10 and 111.95. Glideslopes are UHF 329.15–335.00, paired automatically.");
Q("nav","The localizer course is normally adjusted to be how wide at the runway threshold?",["350 ft","700 ft","1,000 ft"],1,"Width is tailored to 700 ft at the threshold, which yields 3–6°.");
Q("nav","Which ILS components are guidance information?",["Localizer and glideslope.","Marker beacons and DME.","Approach lights."],0,"Guidance = LOC and GS. Range = markers, DME, compass locator. Visual = ALS and runway lights.");
Q("nav","The outer marker is identified by",["a blue light and continuous dashes at 400 Hz.","an amber light and alternating dots and dashes.","a white light and dots."],0,"OM: blue, 400 Hz dashes. MM: amber, dot-dash. IM: white, dots.");
Q("nav","For a 3° glideslope at 120 kt groundspeed, the approximate descent rate is",["400 fpm","600 fpm","800 fpm"],1,"Groundspeed × 5 = 600 fpm.");
Q("nav","DME slant-range error is negligible when the aircraft is",["at least 1 NM from the station per 1,000 ft of altitude.","directly over the station.","below 1,000 ft AGL."],0,"Error grows when you're high and close. It's negligible at ≥ 1 NM per 1,000 ft.");
Q("nav","Magnetic heading 290°, ADF relative bearing 140°. The magnetic bearing TO the station is",["070°","150°","210°"],0,"MH + RB = MB: 290 + 140 = 430 − 360 = 070°.");
Q("nav","Minimum number of satellites needed for RAIM fault detection is",["4","5","6"],1,"4 for a 3D fix, 5 for RAIM fault detection, 6 for FDE (fault detection and exclusion).");
Q("nav","If the GPS RAIM is not available prior to the FAF, the pilot should",["continue the approach and use the MDA.","not begin the approach.","switch to terminal mode and continue."],1,"Without integrity monitoring, don't start (or continue past the FAF on) a GPS approach. Use another approach.");
Q("nav","During a GPS approach, CDI sensitivity changes from ±1 NM to ±0.3 NM",["at the IAF.","beginning 2 NM prior to the FAF.","at the MAP."],1,"Approach mode ramps sensitivity from ±1 NM to ±0.3 NM over the 2 NM before the FAF.");
Q("nav","Which RNAV (GPS) line of minima uses a DA and requires WAAS (or approved baro-VNAV for one of them)?",["LNAV and LP.","LPV and LNAV/VNAV.","LNAV and circling."],1,"LPV (WAAS) and LNAV/VNAV (WAAS or baro-VNAV) use DAs. LNAV and LP use MDAs.");
Q("nav","An approved IFR GPS may NOT be substituted for",["identifying a DME fix.","flying a DME arc.","lateral guidance on the final approach of an NDB approach not titled 'or GPS'."],2,"AIM 1-2-3: GPS can substitute for ADF and DME in most cases, but not for lateral guidance on final of a non-GPS approach.");
Q("nav","A VOR is transmitting without its Morse code identifier. This indicates",["normal operation.","the station is undergoing maintenance and may be unreliable.","voice identification only."],1,"Missing identification means maintenance. Don't use it, even if the indications look normal.");
Q("nav","With a non-WAAS (TSO-C129) GPS with FDE, which is true for filing an alternate?",["You may plan GPS-based approaches at both destination and alternate.","You may plan a GPS-based approach at the destination or the alternate, but not both.","GPS can never be used for alternate planning."],1,"Current AIM 1-1-17: non-WAAS GPS with FDE and a RAIM prediction may plan a GPS IAP at either the destination or alternate, not both, using LNAV or circling minimums at the alternate.");

// hold
Q("hold","What is the maximum holding airspeed for a civil propeller airplane holding at 8,000 ft MSL (no published restriction)?",["200 KIAS","230 KIAS","265 KIAS"],1,"6,001–14,000 MSL: 230 KIAS. Up to 6,000: 200. Above 14,000: 265.");
Q("hold","The maximum holding airspeed at 5,000 ft MSL is",["175 KIAS","200 KIAS","230 KIAS"],1,"Minimum holding altitude through 6,000 MSL: 200 KIAS.");
Q("hold","Standard inbound leg time in a holding pattern at 10,000 ft MSL is",["1 minute","1½ minutes","2 minutes"],0,"1 minute at or below 14,000 MSL. 1½ minutes above 14,000.");
Q("hold","Timing for the outbound leg of a holding pattern should begin",["when the turn outbound is started.","over or abeam the fix, whichever occurs later.","when the wings are level on the inbound course."],1,"AIM 5-3-8: over or abeam the fix, whichever is later. If abeam can't be determined, start when the turn to outbound is complete.");
Q("hold","Inbound, you need a 6° left wind correction. Outbound, you should hold",["6° right.","12° right.","18° right."],2,"Triple the inbound correction and apply it in the opposite direction: 18° right.");
Q("hold","You arrive on a heading of 200° at a fix for a standard (right-turn) hold with an inbound course of 360°. The recommended entry is",["Direct.","Parallel.","Teardrop."],2,"Outbound course 180°. Your heading is 20° to the right of outbound, which falls in the 70° teardrop sector.");
Q("hold","You arrive on a heading of 120° at a fix for a standard (right-turn) hold with an inbound course of 360°. The recommended entry is",["Direct.","Parallel.","Teardrop."],1,"Heading 120° is 60° left of the 180° outbound course, inside the 110° parallel sector.");
Q("hold","You arrive on a heading of 330° at a fix for a standard (right-turn) hold with an inbound course of 360°. The recommended entry is",["Direct.","Parallel.","Teardrop."],0,"Heading 330° is close to the inbound course, so it's in the 180° direct-entry sector.");
Q("hold","You reach your clearance limit and haven't received holding instructions. You should",["hold as published, or if none is published, on the inbound course with right turns, and request further clearance.","proceed to the destination.","hold with left turns."],0,"AIM 5-3-8 / 91.185 logic: hold as published. If none is published, hold on the course you arrived on, with right turns.");
Q("hold","When should you start reducing speed to holding airspeed?",["Within 3 minutes of reaching the holding fix.","Within 5 minutes.","Once over the fix."],0,"Start the speed reduction within 3 minutes before ETA at the holding fix.");
Q("hold","Which element is NOT part of a standard holding clearance?",["Direction of the hold from the fix.","EFC time.","Recommended entry procedure."],2,"ATC doesn't assign the entry. The pilot chooses it.");
// appr
Q("appr","Aircraft approach category is determined by",["maximum gross weight.","VREF, or 1.3 VSO at maximum landing weight if VREF isn't specified.","cruise speed."],1,"Categories: A < 91, B 91–120, C 121–140, D 141–165, E 166+ kt.");
Q("appr","An airplane in Category A circles at 110 kt to land. Which minimums should be used?",["Category A.","Category B.","Category C."],1,"If you maneuver faster than your category's upper limit, use the minimums for the category that matches your speed (110 kt = B).");
Q("appr","If visual reference is lost while circling to land, the pilot should",["descend to regain visual contact.","make a climbing turn toward the landing runway and intercept the missed approach course.","fly straight ahead and climb."],1,"AIM 5-4-21: initial climbing turn toward the landing runway, then the missed approach course.");
Q("appr","A procedure turn is NOT required when",["the approach chart depicts a barbed PT arrow.","radar vectors to the final approach course are provided.","the aircraft is at the IAF."],1,"SHARPTT: no PT when vectored to final, on a NoPT route, straight-in clearance, a timed approach from a hold, etc.");
Q("appr","The maximum speed in a procedure turn should not exceed",["156 KIAS","200 KIAS","230 KIAS"],1,"AIM 5-4-9: 200 KIAS.");
Q("appr","When executing a missed approach before reaching the MAP, the pilot should",["immediately turn to the missed approach heading.","fly the approach course to the MAP at or above the MDA/DA before turning.","climb straight ahead to the MSA."],1,"Obstacle protection assumes the missed approach starts at the MAP.");
Q("appr","A visual approach requires the reported weather at the airport to be at least",["1,000 ft ceiling and 3 SM visibility.","500 ft ceiling and 1 SM visibility.","clear of clouds and 1 SM."],0,"AIM 5-4-23: ceiling ≥ 1,000 ft and visibility ≥ 3 SM, with the airport or preceding aircraft in sight.");
Q("appr","Which statement about a contact approach is true?",["ATC may initiate it to expedite traffic.","It must be requested by the pilot, with at least 1 SM flight visibility, clear of clouds.","It requires 3 SM visibility."],1,"AIM 5-4-25: pilot request only; 1 SM, clear of clouds; the airport must have an IAP. Pilot handles obstacle clearance.");
Q("appr","An approach titled 'VOR-A' indicates",["it's an RNAV approach.","only circling minimums are published.","the approach has two final approach courses."],1,"A letter suffix means the approach doesn't meet straight-in criteria. Circling minimums only.");
Q("appr","During a no-gyro approach, after being turned onto final, the pilot should make turns at",["standard rate.","half-standard rate.","30° bank."],1,"Standard rate until on final, then half-standard rate on final.");
Q("appr","You're on a radar vector, not on a published route, and are 'cleared for the RNAV (GPS) RWY 7 approach.' What altitude do you fly?",["Descend immediately to the FAF altitude.","Maintain the last assigned altitude until established on a published segment of the approach.","Descend to the MSA."],1,"AIM 5-4-7.");
Q("appr","When the ILS glideslope becomes inoperative during the approach, the pilot should",["continue using the ILS DA.","use the localizer (LOC) minimums.","use circling minimums only."],1,"Without the glideslope, it's a nonprecision LOC approach with an MDA (and step-downs/timing as charted).");
Q("appr","On a nonprecision approach, a VDP is",["the point from which a normal descent from the MDA to the runway may begin.","the missed approach point.","the FAF."],0,"Don't descend below the MDA before the VDP, even with the runway in sight. A normal 3° path starts there.");

// atc
Q("atc","Which is the proper order of an ATC clearance?",["Clearance limit, route, altitude, frequency, transponder.","Route, altitude, clearance limit, frequency, transponder.","Clearance limit, altitude, route, transponder, frequency."],0,"CRAFT.");
Q("atc","If not airborne by the clearance void time, you must notify ATC as soon as possible but no later than",["10 minutes.","30 minutes.","1 hour."],1,"AIM 5-2-7: no later than 30 minutes after the void time.");
Q("atc","Under a 'climb at pilot's discretion' clearance, which is true?",["You must climb at 500 fpm or more.","You may level off temporarily, but you can't return to an altitude you've reported leaving.","You must start the climb immediately."],1,"You choose when and how fast to climb, but you can't go back to a vacated altitude.");
Q("atc","A cruise clearance to 7,000 ft authorizes you to",["fly only at exactly 7,000 ft.","fly at any altitude from the minimum IFR altitude up to 7,000, and make an approach at the destination.","climb above 7,000 if VFR."],1,"After you report leaving an altitude in the block, you can't return to it without clearance.");
Q("atc","'Minimum fuel' advisory means",["you're declaring an emergency.","you can accept little or no delay, but it isn't an emergency.","ATC must give you priority."],1,"If fuel becomes critical, declare an emergency.");
Q("atc","After an emergency deviation from an ATC clearance where priority was given, you",["must always file a written report within 24 hours.","must submit a detailed report within 48 hours if requested by ATC.","need not notify ATC."],1,"91.123(d).");
Q("atc","'Cleared as filed' includes which elements?",["Route only (the altitude is stated separately).","Route and altitude.","Route, altitude, and transponder code."],0,"ATC will state the altitude, departure frequency, and squawk.");
Q("atc","When radar vectors end and ATC says 'resume own navigation,' you are",["still on vectors.","responsible for your own navigation.","cleared for the approach."],1,"Resume own navigation means navigate yourself on the cleared route.");
Q("atc","A composite flight plan beginning IFR and changing to VFR uses ICAO flight rules",["Y","Z","I"],0,"Y = IFR first then VFR. Z = VFR first then IFR.");
// comm
Q("comm","Which transponder code indicates lost two-way radio communications?",["7500","7600","7700"],1,"7500 hijack, 7600 lost comm, 7700 emergency.");
Q("comm","Which is NOT a required element of a non-radar position report?",["Time.","Altitude.","Fuel remaining."],2,"Report ID, position, time, altitude, type of flight plan, ETA and next point, following point, remarks.");
Q("comm","'Wilco' means",["message received.","I have received your message, understand, and will comply.","say again."],1,"Wilco = will comply.");
Q("comm","A flashing red light gun signal to an aircraft in flight means",["give way and continue circling.","airport unsafe, do not land.","return for landing."],1,"Steady red = give way and continue circling. Flashing red = airport unsafe.");
Q("comm","When making initial contact with departure control after takeoff while climbing, you should state",["call sign and squawk code.","call sign, current altitude, and the altitude you're climbing to.","call sign and position."],1,"AIM 5-2-9 / 5-3-1: include your current altitude and assigned altitude.");
Q("comm","Inbound IFR to a non-towered airport, when should you change to the CTAF?",["When 10 NM from the airport.","When ATC approves the change to advisory frequency.","After landing."],1,"Change when ATC says 'change to advisory frequency approved,' then self-announce.");
// reports
Q("reports","Which report should be made to ATC without a specific request in a radar environment?",["Leaving the FAF inbound.","Vacating an altitude for a newly assigned altitude.","Passing each compulsory reporting point."],1,"Vacating an altitude is always required. The FAF and compulsory points are non-radar reports.");
Q("reports","You must report a change in TAS of",["5 kt or 5%, whichever is greater.","10 kt or 5%, whichever is greater.","15 kt."],1,"AIM 5-3-3: 10 kt or 5% of the filed TAS, whichever is greater.");
Q("reports","Which must be reported to ATC under 91.187 when operating IFR in controlled airspace?",["Loss of a VOR receiver capability.","Loss of the cabin heater.","Failure of a landing light."],0,"91.187: loss of VOR, TACAN, ADF, or LF nav receiver capability; GPS anomaly; ILS receiver loss; or impaired air/ground comms.");
Q("reports","In a non-radar environment, you must report a revised ETA if it differs from the previous estimate by more than",["2 minutes.","3 minutes.","5 minutes."],0,"AIM 5-3-3: more than 2 minutes (3 minutes in North Atlantic airspace).");
Q("reports","When unable to climb or descend at a rate of at least ___ fpm, you must inform ATC.",["300","500","1,000"],1,"MARVELOUS VFR C500: the '500.'");
Q("reports","On reaching a holding fix, you report",["only the time.","the time and altitude.","fuel remaining."],1,"AIM 5-3-3: time and altitude reaching a holding fix or clearance limit.");
Q("reports","Which item is NOT included in a 91.187 malfunction report?",["Aircraft identification.","Degree to which the ability to operate IFR is impaired.","Name of the mechanic who last inspected the aircraft."],2,"ID, equipment affected, degree of impairment, and nature and extent of ATC assistance desired.");
// aero
Q("aero","An abrupt head movement during a prolonged constant-rate turn in IMC may cause",["the leans.","Coriolis illusion.","autokinesis."],1,"Coriolis is the most overwhelming illusion: rotation felt on a different axis.");
Q("aero","Rolling level abruptly after a prolonged, gradual turn may cause a feeling of banking the opposite way. This is",["the leans.","inversion illusion.","elevator illusion."],0,"The leans is the most common vestibular illusion.");
Q("aero","A rapid acceleration during takeoff can create the illusion of",["being in a nose-down attitude.","being in a nose-up attitude.","a spinning sensation."],1,"Somatogravic illusion: the pilot may push the nose down dangerously.");
Q("aero","An abrupt change from climb to straight-and-level flight can create the illusion of",["tumbling backward.","a descent.","banking."],0,"The inversion illusion can make the pilot push the nose down abruptly.");
Q("aero","A narrower-than-usual runway can create the illusion that the aircraft is",["lower than it actually is.","higher than it actually is.","farther than it actually is."],1,"The pilot tends to fly a lower approach, which risks obstacles and landing short.");
Q("aero","An approach over featureless terrain at night (black hole) can create the illusion of being",["lower than actual, so the pilot flies higher.","higher than actual, so the pilot flies lower.","faster than actual."],1,"The risk is a dangerously low approach.");
Q("aero","Carbon monoxide poisoning results in which type of hypoxia?",["Hypoxic.","Hypemic.","Histotoxic."],1,"CO binds to hemoglobin and reduces the blood's oxygen-carrying capacity: hypemic hypoxia.");
Q("aero","Hypoxia caused by alcohol or drugs is",["histotoxic.","stagnant.","hypemic."],0,"Histotoxic: the cells can't use oxygen.");
Q("aero","The best way to overcome spatial disorientation is to",["rely on body sensations.","rely on and trust the flight instruments.","increase the scan rate of outside references."],1,"Believe your instruments, and keep head movements to a minimum.");
Q("aero","A pilot may not act as crewmember within ___ hours after consuming alcohol, or with a BAC of ___ or greater.",["8; 0.04","12; 0.08","24; 0.04"],0,"91.17.");
Q("aero","Which part of the inner ear senses linear acceleration?",["Semicircular canals.","Otolith organs.","Cochlea."],1,"Otoliths sense gravity and linear acceleration. The semicircular canals sense angular acceleration.");

// ---------- Checkride Coach question bank (part 1) ----------
// Format: [area, ACS code, flashcard topic ids, question, model answer, reference, [[follow-up q, answer, ref], ...]]
// ACS = FAA-S-ACS-8C Instrument Rating – Airplane (Nov 2023, effective May 31, 2024). Regs checked on eCFR Oct 2026.
var COACH_AREAS=[
 ["IA","I.A","Pilot Qualifications"],["IB","I.B","Weather Information"],["IC","I.C","Cross-Country Flight Planning"],
 ["IIA","II.A","Aircraft Systems for IFR"],["IIB","II.B","Flight Instruments & Nav Equipment"],["IIC","II.C","Instrument Flight Deck Check / IFR Airworthiness"],
 ["IIIA","III.A","ATC Clearances & Procedures"],["IIIB","III.B","Holding Procedures"],["IV","IV","Flight by Reference to Instruments"],
 ["VA","V.A","Intercepting & Tracking / DME Arcs"],["VB","V.B","Departure, En Route & Arrival"],
 ["VIA","VI.A","Non-precision Approach"],["VIB","VI.B","Precision Approach"],["VIC","VI.C","Missed Approach"],["VID","VI.D","Circling Approach"],["VIE","VI.E","Landing from an Instrument Approach"],
 ["VIIA","VII.A","Loss of Communications"],["VIID","VII.D","Loss of Primary Flight Instruments"],["VIIIA","VIII.A","Postflight Procedures"]];
var COACH_Q=[
// ===== I.A Pilot Qualifications =====
["IA","IR.I.A.K1","regs","What do you need to act as PIC under IFR? Walk me through your instrument currency requirements.",
 "Within the 6 calendar months preceding the month of the flight: 6 instrument approaches, holding procedures and tasks, and intercepting and tracking courses using navigation systems, in actual or simulated conditions (aircraft, FFS, FTD, or ATD, in any combination). Plus the normal PIC basics: flight review within 24 calendar months, medical (or BasicMed), and 3 takeoffs/landings in 90 days to carry passengers.",
 "14 CFR 61.57(c); 61.56; 61.23; 61.57(a)",
 [["Say your last approach was flown March 10. Through what date are you current, if everything else was done in March too?","Through September 30. Tasks in March cover flights through the end of the 6th calendar month after March.","14 CFR 61.57(c)"],
  ["Now it's November and you haven't done anything since March. What are your options?","You're in the 6-month grace period (October–March). You can regain currency by flying the 6 approaches, holding, and intercept/track with a safety pilot, with a CFII, or in an approved device. After the grace period you need an IPC.","14 CFR 61.57(c)–(d)"]]],
["IA","IR.I.A.K1","regs","What is an Instrument Proficiency Check, who can give it, and when is it required?",
 "An IPC is required if you've been out of instrument currency for more than 6 calendar months. It covers the areas of operation in the Instrument Rating ACS (appendix of Part 61 lists which tasks). It can be given by an examiner, an authorized instructor (CFII), a company check pilot authorized under 121/125/135 or subpart K, a person authorized by the Armed Forces (for military pilots), or a person approved by the Administrator. It can be done in an aircraft or an FFS/FTD representative of the category.",
 "14 CFR 61.57(d); Instrument Rating ACS",
 [["Can you fly in IMC with a CFII to get current again if you're past the grace period?","You can fly with the CFII as training, but the only way to reestablish currency after the grace period is completing the IPC. The CFII can act as PIC.","14 CFR 61.57(d)"]]],
["IA","IR.I.A.K1","regs","You want to practice approaches under the hood with a buddy. What does the safety pilot need?",
 "At least a private pilot certificate with category and class ratings appropriate to the aircraft, adequate vision forward and to each side (or a competent observer supplements), and the aircraft must have fully functioning dual controls (with limited exceptions for throwover controls). Because the safety pilot is a required crewmember, they also need a current medical (or BasicMed eligibility); confirm details with your CFII.",
 "14 CFR 91.109(c); 61.3(c); 61.23",
 [["Can you log the approaches you fly under the hood with the safety pilot for currency?","Yes. Simulated instrument conditions with a view-limiting device count toward 61.57(c). Log the safety pilot's name, and the approaches, holding, and tracking tasks.","14 CFR 61.57(c)(1); 61.51(g)"]]],
["IA","IR.I.A.K3","regs","Can you fly IFR under BasicMed?",
 "Yes. BasicMed (Part 68 / 61.113(i)) allows IFR and VFR within the limits: aircraft with no more than 6 occupants and max certificated takeoff weight not more than 6,000 lb, not for compensation or hire, at or below 18,000 MSL and not more than 250 KIAS. You need a valid U.S. driver's license, a prior medical issued after July 14, 2006, the course every 24 calendar months and a physical exam every 48 months.",
 "14 CFR 61.113(i); Part 68",[]],
["IA","IR.I.A.K1","regs","What are the logging requirements for instrument time, and what do you record for an approach?",
 "Log actual or simulated instrument time only when flying solely by reference to instruments. For currency/aeronautical experience, record the location and type of each approach, and the name of the safety pilot if one was used.",
 "14 CFR 61.51(g)",[]],
["IA","IR.I.A.K2","regs","What privileges does the instrument rating give you, and what limitations remain?",
 "You may act as PIC under IFR and in weather below VFR minimums (with currency). It does not change your certificate privileges: as a private pilot you still can't fly for compensation or hire. You must also be current, carry an airworthy and IFR-equipped aircraft, and file/receive an IFR clearance in controlled airspace.",
 "14 CFR 61.3(e); 61.57(c); 91.173",[]],
// ===== I.B Weather =====
["IB","IR.I.B.K2","wx","What weather do you have to obtain before an IFR flight?",
 "For a flight under IFR, 91.103 requires becoming familiar with all available information, including weather reports and forecasts, fuel requirements, alternatives if the flight can't be completed as planned, and any known ATC delays. In practice: METARs, TAFs, GFA, AIRMETs/SIGMETs/convective SIGMETs, PIREPs, winds/temps aloft, NOTAMs, and freezing levels.",
 "14 CFR 91.103(a); AC 00-45 (Aviation Weather Services)",
 [["Where do you get an official briefing?","Flight Service (1-800-WX-BRIEF or 1800wxbrief.com) or other FAA-approved sources. In Alaska, Flight Service is operated by the FAA.","AIM ch. 7 sec. 1"]]],
["IB","IR.I.B.K2g","wx","Explain the three AIRMETs and what a SIGMET and convective SIGMET cover.",
 "AIRMET Sierra: IFR conditions and mountain obscuration. Tango: moderate turbulence, sustained surface winds of 30 kt or more, low-level wind shear. Zulu: moderate icing and freezing levels. SIGMET: severe or extreme turbulence, severe icing, widespread dust/sand storms, volcanic ash. Convective SIGMET: thunderstorms (lines, embedded, areas), tornadoes, hail 3/4 inch or larger, surface winds 50 kt or more.",
 "AC 00-45 (Aviation Weather Services); AIM 7-1",[]],
["IB","IR.I.B.K2c","wx","Decode this: TAF PAEN 281730Z 2818/2918 18012KT P6SM -RA OVC015 TEMPO 2818/2822 3SM BR OVC008. Is this good for a destination?",
 "Issued the 28th at 1730Z, valid 28th 18Z to 29th 18Z. Wind 180 at 12, visibility greater than 6 SM, light rain, overcast 1,500. Temporarily between 18Z and 22Z, 3 SM in mist with overcast 800. It's legal as a destination if you have an alternate, but you'd want to compare those TEMPO conditions to the approach minimums and to the 1-2-3 rule: with an 800-foot ceiling forecast within the window you need an alternate.",
 "AC 00-45; 14 CFR 91.169(b)",[]],
["IB","IR.I.B.K3i","wx","You're going to fly IFR through a layer in winter. How do you assess the icing risk?",
 "Visible moisture plus temperatures near or below freezing (0 to about -20°C is the highest-risk band). Check freezing levels, AIRMET Zulu, Current/Forecast Icing Products (CIP/FIP), PIREPs, cloud tops, and temperature inversions that could cause freezing rain. Have an out: warmer air below, VMC on top, or a route to land. Unless your airplane is approved for flight into known icing (FIKI), plan to avoid it.",
 "AC 00-45; AC 91-74 (Pilot Guide: Flight in Icing Conditions); AIM 7-1",
 [["You start picking up ice at 6,000 and ATC is busy. What are your actions?","Fly the airplane, turn on pitot heat and any anti-ice/defrost, request a different altitude (usually toward warmer air or tops) or a reroute, and declare an emergency if needed. Report the icing as a PIREP. If freezing rain, there's warmer air above.","14 CFR 91.3(b); 91.183(b); AIM 7-1"]]],
["IB","IR.I.B.K3h","wx","How close should you get to a thunderstorm, and what does your onboard datalink weather show?",
 "Avoid severe thunderstorms by at least 20 NM, and don't fly under anvils or between closely spaced cells. Datalink (ADS-B FIS-B/NEXRAD) imagery is delayed and can be as much as 15–20 minutes older than the age shown, so use it for strategic avoidance, not tactical penetration.",
 "AIM 7-1 (Thunderstorms and FIS-B limitations); AC 00-24 (Thunderstorms)",[]],
["IB","IR.I.B.K2e","wx","Why doesn't a winds aloft forecast show a wind at 3,000 for some stations?",
 "No winds are forecast within 1,500 feet of the station elevation, and no temperatures for the 3,000-foot level or within 2,500 feet of station elevation.",
 "AC 00-45 (Winds and Temperatures Aloft Forecast)",[]],
// ===== I.C Cross-Country Flight Planning =====
["IC","IR.I.C.K1d","regs","When do you need to file an alternate? Give me the rule.",
 "The 1-2-3 rule: an alternate is required unless the destination has a standard instrument approach and, from 1 hour before to 1 hour after the ETA, the forecast is at least a 2,000-foot ceiling above the airport elevation and 3 SM visibility.",
 "14 CFR 91.169(a)(2), (b)",
 [["What weather must the alternate have to be listed?","At the ETA at the alternate: the alternate minimums published for that procedure, or if none, the standard: 600-2 for a precision approach, 800-2 for a non-precision approach. If the airport has no instrument approach, the weather must allow descent from the MEA, approach and landing under basic VFR.","14 CFR 91.169(c)"],
  ["What does an 'A' in a black triangle or 'A NA' on the approach chart mean?","Non-standard alternate minimums apply (listed in the front of the TPP), or alternate minimums are not authorized (NA), often due to no weather reporting or unmonitored facilities.","TPP Legend; Instrument Procedures Handbook"]]],
["IC","IR.I.C.K3c","regs","What fuel do you need for an IFR flight?",
 "Enough to fly to the first airport of intended landing, then to the alternate (if one is required), then 45 minutes at normal cruising speed.",
 "14 CFR 91.167(a)",
 [["If the destination meets 1-2-3 and you don't file an alternate, what's the fuel requirement?","Destination plus 45 minutes at normal cruise.","14 CFR 91.167(b)"]]],
["IC","IR.I.C.K1d","nav","You have a WAAS GPS. Can you plan to use a GPS approach at your alternate?",
 "Yes with a TSO-C145/C146 (WAAS) receiver, but flight planning at the alternate must be based on LNAV or circling minimums (not LPV or LNAV/VNAV) unless your AFM supplement says otherwise; at arrival you may use whatever approach is available. With a non-WAAS (TSO-C129) receiver, if you plan a GPS approach at the destination, the alternate must have an approved approach that isn't GPS-based and is expected to be available.",
 "AIM 1-1-17 and 1-1-18; AFM/AFMS for your GPS",[]],
["IC","IR.I.C.K4","regs","What goes in an IFR flight plan beyond a VFR one, and when should you file?",
 "Everything required by 91.153 plus an alternate (unless excepted by 91.169(b)), the route of flight, cruising altitude, and equipment suffixes (ICAO format). File at least 30 minutes before the estimated departure time; preferential handling isn't guaranteed if filed later.",
 "14 CFR 91.169(a); AIM ch. 5 sec. 1 (IFR flight plans)",[]],
["IC","IR.I.C.K2","air","How do you pick an IFR altitude? What if there's no MEA published for your direct route?",
 "At or above MEA (or MOCA within 22 NM of the VOR), consider terrain/obstacles, icing/freezing level, winds, oxygen, and glide distance. In uncontrolled airspace use the hemispheric rule (0–179° magnetic course: odd thousands; 180–359°: even). Off airways with no published minimum: 2,000 ft above the highest obstacle within 4 NM of course in designated mountainous areas (like most of Alaska), otherwise 1,000 ft.",
 "14 CFR 91.177; 91.179",[]],
["IC","IR.I.C.K5","atc","You're departing a non-towered airport in IMC. How do you get your clearance and what's a void time?",
 "Call ATC or FSS by phone (or remote frequency / clearance delivery through an RCO). They may issue a release with a void time: if you aren't airborne by then, the clearance is void and you must notify ATC within 30 minutes (or the time ATC specifies) after the void time that you didn't depart.",
 "AIM ch. 5 sec. 2 (Departure Restrictions, Clearance Void Times, Hold for Release, and Release Times)",
 [["How do you close the IFR flight plan landing at a non-towered field?","Cancel with ATC by radio before landing (if VMC) or call FSS/ATC by phone after landing. It isn't automatic like at a towered airport.","14 CFR 91.169(d); AIM ch. 5 sec. 1 (Canceling IFR flight plan)"]]],
["IC","IR.I.C.K1h","charts","What do you look for in the Chart Supplement before an IFR flight?",
 "Runway lengths and lighting, approach lighting, pilot-controlled lighting frequencies, fuel availability, weather reporting (AWOS/ASOS), communications/clearance delivery, NOTAM file, airport remarks, VOR test facilities and checkpoints.",
 "Chart Supplement; 14 CFR 91.103",[]],
["IC","IR.I.C.K1g","regs","What NOTAMs matter most for an IFR trip?",
 "NOTAMs for your departure, destination, and alternate: runway/lighting closures, approach procedure changes (FDC NOTAMs), unserviceable navaids, GPS testing/interference, TFRs and special use airspace, and alternate minimums that are not authorized due to outages.",
 "14 CFR 91.103; AIM ch. 5 sec. 1 (NOTAM system)",[]],
// ===== II.A Aircraft systems =====
["IIA","IR.II.A.K1","inst","Is your airplane approved for flight into known icing? How would you tell?",
 "Check the POH/AFM limitations and the Kinds of Operations Equipment List (KOEL), plus any placards. FIKI approval requires a certified ice protection system. Having pitot heat or a heated windshield alone is not FIKI.",
 "POH/AFM Section 2 (Limitations); AC 91-74",[]],
["IIA","IR.II.A.K2","inst","Your autopilot starts trimming against you in IMC. What do you do?",
 "Fly the airplane, disconnect the autopilot (A/P disconnect, then circuit breaker or pitch trim interrupt if needed), hand-fly using the attitude indicator, follow the POH runaway trim procedure, tell ATC if you need help.",
 "POH/AFM emergency procedures; IR ACS II.A",[]],
// ===== II.B Instruments & Nav =====
["IIB","IR.II.B.K1a","inst","The static port ices over during a climb. What do your instruments show, and what do you do?",
 "The altimeter freezes at the altitude of the blockage, the VSI goes to zero, and the airspeed reads lower than actual in a continued climb (higher than actual in a descent). Use the alternate static source: in most unpressurized airplanes the altimeter and airspeed then read slightly high and the VSI shows a momentary climb.",
 "Instrument Flying Handbook (FAA-H-8083-15) ch. 5",
 [["What if the pitot tube ices over but the drain hole stays open?","The airspeed drops toward zero. If both the ram inlet and drain are blocked, the ASI acts like an altimeter: it reads higher in a climb and lower in a descent.","FAA-H-8083-15 ch. 5"]]],
["IIB","IR.II.B.K1b","inst","Explain gyroscopic precession and rigidity in space, and which instruments use which.",
 "Rigidity in space keeps the gyro's plane fixed (attitude indicator, heading indicator). Precession makes a force act 90° ahead in rotation (turn coordinator/turn-and-slip). Most of those gyros are vacuum-driven in older airplanes; the turn coordinator is usually electric for redundancy.",
 "FAA-H-8083-15 ch. 5",[]],
["IIB","IR.II.B.K1d","inst","What are the magnetic compass errors?",
 "Variation, deviation, magnetic dip. Northerly turning error (UNOS: undershoot north, overshoot south, in the Northern Hemisphere), acceleration error (ANDS: accelerate north, decelerate south on east/west headings), and oscillation. Turning errors are larger at high latitudes like Alaska.",
 "FAA-H-8083-15 ch. 5",[]],
["IIB","IR.II.B.K2b","nav","What's the difference between LPV, LNAV/VNAV, LNAV, and LP minimums?",
 "LPV: WAAS-based, angular lateral and vertical guidance, DA, often as low as ILS. LNAV/VNAV: vertical guidance (WAAS or baro-VNAV), DA. LNAV: lateral only, MDA. LP: WAAS precise lateral only, MDA, published where vertical isn't possible. LPV and LNAV/VNAV are approaches with vertical guidance (APV), not precision approaches.",
 "AIM 5-4-5; AIM 1-1-18",
 [["You get an 'LNAV' annunciation instead of 'LPV' inside the FAF. What do you do?","Fly to the LNAV MDA (the GPS has downgraded). If the downgrade happens after the FAF and you're unsure or unstable, execute the missed approach.","AIM 1-1-18; GPS AFMS"]]],
["IIB","IR.II.B.K2b","nav","What is RAIM and when does it matter?",
 "Receiver Autonomous Integrity Monitoring checks the satellite geometry to ensure position integrity. Non-WAAS receivers need a RAIM prediction for the approach ETA; WAAS receivers use WAAS integrity and generally don't need a RAIM prediction unless WAAS is unavailable (check NOTAMs). If you lose integrity on an approach, fly the missed.",
 "AIM 1-1-17",[]],
["IIB","IR.II.B.K3","nav","You're using an iPad EFB. What are the rules and what are its limits?",
 "For Part 91, an EFB can replace paper charts if the data is current and you have a backup plan (second device, battery, or paper). You must have the information to complete the flight. It is not a certified nav source; position on the moving map is for situational awareness.",
 "AC 120-76 (EFB); AC 91-78 (Use of Class 1 or 2 EFBs, Part 91); 14 CFR 91.103",[]],
];

// ---------- Checkride Coach question bank (part 2) ----------
COACH_Q.push(
// ===== II.C Flight deck check / IFR airworthiness =====
["IIC","IR.II.C.K2","regs","Show me this airplane is legal for IFR. What inspections are required?",
 "AV1ATE: Annual (12 calendar months, 91.409); VOR check within 30 days if using VOR for IFR (91.171); 100-hour if carrying people for hire or giving flight instruction for hire (91.409); Altimeter/static system and encoder within 24 calendar months for IFR in controlled airspace (91.411); Transponder within 24 calendar months (91.413); ELT inspection within 12 calendar months and battery per 91.207. Plus ADs complied with (91.403/39).",
 "14 CFR 91.409, 91.171, 91.411, 91.413, 91.207, 91.403",
 [["The altimeter/static test was done March 15, 2024. Today is March 31, 2026. Can you fly IFR in controlled airspace? What about April 1?","Yes on March 31: 'within the preceding 24 calendar months' runs through the end of the 24th calendar month. On April 1, 2026 it's expired for IFR in controlled airspace.","14 CFR 91.411(a)(1)"],
  ["The static system was opened for maintenance last week. Anything else?","Yes. After any opening and closing of the static system (other than the drain or alternate static valve), it must be tested and inspected again before IFR in controlled airspace.","14 CFR 91.411(a)(2)"]]],
["IIC","IR.II.C.K2","regs","What equipment is required for IFR flight?",
 "Everything for day VFR (and night VFR if at night) plus GRABCARD: Generator/alternator of adequate capacity, Radios (two-way comm and nav suitable for the route), Altimeter (sensitive, adjustable), Ball (slip-skid indicator), Clock with hours, minutes, seconds (sweep-second or digital), Attitude indicator, Rate-of-turn indicator (unless a qualifying third attitude system), Directional gyro.",
 "14 CFR 91.205(d)",
 [["At or above FL240, what else?","If VOR navigation is required, DME or a suitable RNAV system.","14 CFR 91.205(e)"]]],
["IIC","IR.II.C.K2","nav","How do you do a VOR check and what are the tolerances?",
 "Within the preceding 30 days: VOT ±4°, designated ground checkpoint ±4°, designated airborne checkpoint ±6°, airway check over a prominent ground point more than 20 NM out ±6°, or dual VOR check against each other within 4° of each other. Log DEPS: Date, Error, Place, Signature.",
 "14 CFR 91.171",
 [["Your VOR check is 35 days old but you're flying a GPS route and RNAV approach. Is that legal?","The 30-day check applies when you operate under IFR using the VOR system. If you truly aren't using VOR for navigation, the check isn't required, but a VOR approach or VOR-based missed approach/alternate would need it. Most pilots just keep it current.","14 CFR 91.171(a)"]]],
["IIC","IR.II.C.K3","regs","Your heading indicator is inoperative and you have no MEL. Can you go?",
 "Use 91.213(d): it's allowed only if the item isn't required by the VFR-day type certification, the equipment list/KOEL, 91.205 or another rule for the kind of operation, or an AD; and it's removed or deactivated and placarded 'Inoperative', with a determination by a pilot or mechanic that it isn't a hazard. For IFR, a directional gyro is required by 91.205(d), so no IFR flight with it inoperative.",
 "14 CFR 91.213(d); 91.205(d)",[]],
["IIC","IR.II.C.K1","inst","Walk me through your instrument checks during taxi.",
 "Turn coordinator shows a turn with the ball moving opposite; heading indicator and compass turn correctly; attitude indicator stable within 5° bank in turns after erecting (about 5 minutes); altimeter set to local altimeter setting reads within ±75 ft of field elevation; VSI zero (or note the error); airspeed zero. Nav/comm and GPS database current, avionics checks, pitot heat check.",
 "FAA-H-8083-15 ch. 5; AIM 7-2 (altimeter); IR ACS II.C",[]],
// ===== III.A ATC clearances =====
["IIIA","IR.III.A.K1","atc","Read me back this clearance format. What are its elements?",
 "CRAFT: Clearance limit, Route, Altitude (initial and expected), Frequency (departure), Transponder code. Plus any void time or departure procedure.",
 "AIM ch. 4 sec. 4 (ATC Clearances); AIM ch. 5 sec. 2",
 [["ATC says 'climb and maintain 3,000, expect 7,000 ten minutes after departure'. Why does the 'expect' matter?","It's the altitude you'd use for lost communications: after the expected time, climb to it (if higher than the MEA and assigned).","14 CFR 91.185(c)(2)"]]],
["IIIA","IR.III.A.K2","regs","ATC gives you a clearance that would take you into a thunderstorm. What do you do?",
 "Say 'unable' and ask for an alternative. You can't deviate from a clearance except in an emergency, but you may refuse a clearance that's unsafe. If you exercise emergency authority, notify ATC as soon as possible and send a written report on request (91.3(c)); if ATC gave you priority in an emergency, a detailed report within 48 hours to that ATC facility manager if ATC requests it (91.123(d)).",
 "14 CFR 91.123(a)–(d); 91.3(b)–(c)",[]],
["IIIA","IR.III.A.K1","atc","What's a 'cruise' clearance?",
 "It lets you fly at any altitude from the minimum IFR altitude up to and including the altitude specified, and you can climb/descend within that block at your discretion. Once you report leaving an altitude in descent, you can't return to it without another clearance. It also authorizes an approach at the destination.",
 "AIM ch. 4 sec. 4 (Clearance items); Pilot/Controller Glossary 'Cruise'",[]],
["IIIA","IR.III.A.K1","atc","What is VFR-on-top, and what rules do you fly by?",
 "An IFR clearance that lets you fly at VFR altitudes above (or between) layers. You must fly at the appropriate VFR cruising altitude, meet VFR visibility and cloud clearances, and still comply with IFR rules (minimum IFR altitudes, position reports, ATC instructions). Not allowed in Class A.",
 "14 CFR 91.159; 91.155; AIM ch. 4 sec. 4 (VFR-on-top)",[]],
["IIIA","IR.III.A.K1","reports","What are the required reports to ATC all the time, and in a non-radar environment?",
 "All the time (MARVELOUS VFR C500): Missed approach; Airspeed change of ±10 kt or 5% of TAS; Reaching a holding fix (time and altitude); VFR-on-top altitude change; ETA change of more than 3 minutes (non-radar); Leaving a holding fix; Outer marker / FAF inbound (non-radar); Unforecast weather; Safety of flight issues; Vacating an altitude; Failure of nav/approach/comm equipment (91.187); Compulsory reporting points (non-radar); Unable to climb or descend at 500 fpm.",
 "14 CFR 91.183, 91.187; AIM ch. 5 sec. 3 (Additional reports)",
 [["Your VOR receiver dies in flight. What exactly do you report?","Aircraft ID, the equipment affected, how it impairs your ability to operate IFR, and what help you need from ATC.","14 CFR 91.187(b)"]]],
["IIIA","IR.III.A.K3","comm","When you're cleared 'direct' and get no radar contact, what changes for you?",
 "In non-radar, you must report compulsory reporting points (solid triangles) with position, time, altitude, type of flight plan (not needed when talking to ARTCC or approach control), ETA and name of next fix, and the following fix. Report FAF inbound and leaving the FAF, and ETA changes over 3 minutes.",
 "14 CFR 91.183(a); AIM ch. 5 sec. 3 (Position reporting)",[]],
// ===== III.B Holding =====
["IIIB","IR.III.B.K1","hold","What are the maximum holding speeds and leg times?",
 "All aircraft unless a chart or ATC says otherwise: up to 6,000 MSL 200 KIAS; 6,001–14,000 MSL 230 KIAS; above 14,000 265 KIAS. Charts may show a different maximum with an icon. Inbound legs: 1 minute at or below 14,000 MSL, 1.5 minutes above.",
 "AIM 5-3-8",
 [["You're cleared to hold at 7,000 in a Cessna. What speed?","Slow to holding speed within 3 minutes of the fix, typically your POH-recommended holding speed (well under 230 KIAS). Your normal cruise of ~110 kt is fine.","AIM 5-3-8"]]],
["IIIB","IR.III.B.K1","hold","ATC says: 'Hold southwest of the ABC VOR on the 230 radial, left turns, expect further clearance at 1430.' Describe the entry if you're arriving heading 090.",
 "The inbound course is 050° (inbound on the 230 radial to the VOR). With left turns the pattern lies on the northwest side of the inbound course. For left turns, the direct-entry sector is from 110° left to 70° right of the inbound course; heading 090 is 40° right of 050°, so it's a direct entry: cross the fix, turn left to the outbound heading of about 230°, time or fly the outbound leg, and turn left inbound.",
 "AIM 5-3-8 (Holding pattern entry procedures)",
 [["What if ATC never gives you an EFC and you lose comms?","If holding at a fix from which an approach begins with no EFC, leave the fix to begin the approach as close as possible to your ETA. If the clearance limit isn't an approach fix and no EFC was received, proceed to a fix from which an approach begins on arrival at the limit.","14 CFR 91.185(c)(3)"]]],
["IIIB","IR.III.B.K1","hold","What items must a holding clearance include, and what do you report?",
 "Direction of hold from the fix, the holding fix, radial/course/airway/route on which to hold, leg length in miles if DME/RNAV used (or minutes), direction of turns if left, and an EFC time. Report the time and altitude reaching the holding fix and when leaving it.",
 "AIM 5-3-8; 14 CFR 91.183",[]],
// ===== IV Flight by reference to instruments =====
["IV","IR.IV.A.K2","aif","Explain the control/performance method and the primary/supporting method.",
 "Control and performance: set attitude and power on the control instruments (AI, tach/MP), then check performance instruments (altimeter, ASI, HI, VSI) and adjust. Primary/supporting: identifies which instrument is primary for pitch, bank and power for each maneuver (e.g., straight and level: altimeter primary for pitch, HI for bank, ASI for power).",
 "FAA-H-8083-15 ch. 6",[]],
["IV","IR.IV.B.K1","aif","Recover from a nose-low, high-airspeed, steep bank unusual attitude.",
 "Reduce power, level the wings with coordinated aileron and rudder, then smoothly raise the nose to level flight (avoid overstress), then reset power. For nose-high: add power, lower the nose, level the wings, return to straight-and-level.",
 "FAA-H-8083-15 ch. 6 (Unusual attitudes)",[]],
["IV","IR.IV.B.K2","aero","What causes spatial disorientation in IMC, and how do you avoid it?",
 "Vestibular illusions: the leans, Coriolis (head movement in a turn), graveyard spiral/spin, somatogravic (acceleration feels like pitch up), inversion illusion, elevator illusion. Avoid by trusting instruments, scanning, avoiding abrupt head movements, using the autopilot, and staying proficient.",
 "AIM 8-1-5; FAA-H-8083-15 ch. 3",[]],
["IV","IR.IV.B.K3","aero","You're flying VFR and inadvertently enter IMC. How do you safely regain VMC?",
 "Trust the instruments, level the wings, maintain altitude and heading, use the autopilot if available, make a standard-rate 180° turn back to where VMC was, and get ATC help (declare an emergency or request an IFR clearance) if needed. Avoid descending into terrain.",
 "FAA-H-8083-15; IR ACS IV.B",[]],
// ===== V.A Intercepting & tracking / DME arcs =====
["VA","IR.V.A.K1","nav","How do you fly a DME arc and correct for drift?",
 "Turn about 90° to the radial at the lead point (about 0.5 NM before the arc for typical GA speeds), then keep the bearing pointer near the wingtip reference. Make small turns of 10–20° each time the pointer falls behind the wingtip; if outside the arc, turn more toward the station; if inside, turn less. Lead the turn onto the final course.",
 "FAA-H-8083-15 ch. 9; Instrument Procedures Handbook",[]],
["VA","IR.V.A.K1","nav","What's the minimum reception altitude (MRA), MCA, MOCA, and OROCA?",
 "MRA: lowest altitude at which an intersection can be determined. MCA: altitude at which a fix must be crossed when proceeding toward a higher MEA. MOCA: obstacle clearance on the airway and nav reception only within 22 NM of the VOR. OROCA: off-route obstruction clearance altitude: 1,000 ft (2,000 in mountainous) above obstacles in a grid; not a guarantee of nav or comm reception.",
 "14 CFR 91.177; Pilot/Controller Glossary; IFR enroute chart legend",[]],
["VA","IR.V.A.K2","nav","How do you know your GPS is ready for the approach before the FAF?",
 "The approach is loaded from a current database, the CDI is in GPS mode and sensitivity scales to approach mode (0.3 NM) within 2 NM of the FAF, the annunciator shows the expected minima type (LPV, LNAV/VNAV, LNAV), and no integrity alerts. Flying vectors-to-final, activate the leg to the FAF.",
 "AIM 1-1-17, 1-1-18; AIM 5-4-5",[]],
// ===== V.B Departure, en route, arrival =====
["VB","IR.V.B.K1","charts","You're departing a runway with a published ODP and a non-standard takeoff minimum. Part 91 – do you have to comply?",
 "Part 91 operators aren't required to meet takeoff minimums (91.175(f) applies to 121/125/129/135), but it's strongly recommended. Obstacle departure procedures are also not mandatory for Part 91 unless assigned in your clearance, but flying them (or confirming climb performance) is how you avoid terrain.",
 "14 CFR 91.175(f); AIM ch. 5 sec. 2 (Instrument Departure Procedures) (Instrument Departure Procedures)",
 [["The ODP needs 350 ft/NM to 3,000. Your groundspeed is 90 kt. What rate of climb?","Climb rate = gradient × groundspeed / 60 = 350 × 90 / 60 = 525 fpm.","TPP climb rate table; AIM ch. 5 sec. 2 (Instrument Departure Procedures)"]]],
["VB","IR.V.B.K1","charts","What's the standard climb gradient assumed for IFR departures if nothing is published?",
 "200 ft per NM, crossing the departure end of the runway at least 35 ft AGL, and climbing to 400 ft above the airport before turning, unless the procedure says otherwise.",
 "AIM ch. 5 sec. 2 (Instrument Departure Procedures); Instrument Procedures Handbook ch. 1",[]],
["VB","IR.V.B.K2","atc","What's the difference between a STAR and an ODP/SID, and what does 'descend via' mean?",
 "A SID is an ATC departure procedure (requires being in the clearance, may need climb gradients); an ODP is for obstacle clearance; a STAR is an arrival procedure from en route to the terminal area. 'Descend via' authorizes descent at pilot discretion while meeting all published altitude and speed restrictions on the STAR.",
 "AIM ch. 5 sec. 2 (Instrument Departure Procedures); AIM 5-4-1",[]],
);

// ---------- Checkride Coach question bank (part 3) ----------
COACH_Q.push(
// ===== VI.A Non-precision =====
["VIA","IR.VI.A.K1","appr","The ATIS says ceiling 300 and visibility 1/2, below the minimums for the RNAV approach. Can you shoot it?",
 "Under Part 91, yes: you may begin the approach regardless of reported weather. You just can't descend below the MDA/DA unless the 91.175(c) conditions are met, and you can't land unless the flight visibility is at least the visibility on the procedure.",
 "14 CFR 91.175(c)–(d)",
 [["What three things must be true to go below the MDA?","(1) Continuously in a position to descend to land on the intended runway at a normal rate using normal maneuvers; (2) flight visibility not less than the visibility on the approach; (3) at least one of the listed visual references for the intended runway distinctly visible and identifiable.","14 CFR 91.175(c)"],
  ["Name the visual references.","Approach light system (but not below 100 ft above TDZE on approach lights alone unless red terminating bars or red side row bars are visible); threshold; threshold markings; threshold lights; REIL; VASI; touchdown zone or its markings; touchdown zone lights; runway or runway markings; runway lights.","14 CFR 91.175(c)(3)"]]],
["VIA","IR.VI.A.K1","appr","What's a visual descent point (VDP), and what if there isn't one?",
 "The point on the final segment of a non-precision approach from which a normal descent from the MDA to the runway touchdown point may begin, if the visual references are in sight. Don't descend below the MDA before the VDP. If none is published, you can estimate one (e.g., height above touchdown ÷ 300 = NM from the threshold for a ~3° path).",
 "AIM 5-4-5; Instrument Procedures Handbook ch. 4",[]],
["VIA","IR.VI.A.K1","appr","When are you NOT allowed to fly the procedure turn?",
 "When the approach shows 'NoPT' for your route, when you're radar vectored to the final approach course or fix, or when you're on a timed approach from a holding fix, unless ATC clears you for it.",
 "14 CFR 91.175(j)",[]],
["VIA","IR.VI.A.K1","appr","ATC vectors you to final and says 'cleared RNAV 25 approach'. You're at 4,000 and the IAF shows 3,000. When can you descend?",
 "On a vector or unpublished route, maintain the last assigned altitude until established on a segment of a published route or the approach, then descend to the published altitudes for that segment.",
 "14 CFR 91.175(i); AIM ch. 5 sec. 4 (Approach clearance)",[]],
["VIA","IR.VI.A.K4","appr","What makes a stabilized approach, and what do you do if you aren't?",
 "On the correct flight path, small corrections only, configured for landing, at target airspeed, normal descent rate (generally no more than ~1,000 fpm), power appropriate, checklists done; generally established by 1,000 ft above airport in IMC. If not stabilized, go missed.",
 "Airplane Flying Handbook (FAA-H-8083-3) ch. 9; Instrument Procedures Handbook; IR ACS VI.A.K4",[]],
["VIA","IR.VI.A.K2","nav","What's the difference between a 'step-down fix' and the MDA, and what's a VDA?",
 "Step-down fixes allow descent to a lower altitude once passed on the final segment. The MDA is the lowest you may descend without the required visual references. A vertical descent angle (VDA) is advisory: a stabilized path from the FAF to the TCH, but it doesn't guarantee obstacle clearance below the MDA.",
 "AIM 5-4-5; TPP legend",[]],
["VIA","IR.VI.A.K3","nav","You're cleared for a VOR approach. What must you check before relying on that VOR?",
 "The VOR check within 30 days (91.171), identify the station by Morse code (no ID or 'TEST' means unusable), confirm the nav source is VOR not GPS on the CDI, and check NOTAMs for outages.",
 "14 CFR 91.171; AIM 1-1-3",[]],
// ===== VI.B Precision =====
["VIB","IR.VI.B.K1","appr","What are the components of an ILS and what can substitute for the outer marker?",
 "Localizer, glide slope, outer marker (inner marker only for Cat II/III). Substitutes for the outer marker: compass locator, PAR or ASR, DME/VOR/NDB fixes authorized in the procedure, or a suitable RNAV system with a fix identified in the procedure.",
 "14 CFR 91.175(k)",[]],
["VIB","IR.VI.B.K1","appr","The glide slope fails at the FAF. What do you do?",
 "Continue on the localizer only to the LOC (or 'S-LOC') minimums if they're published and you're set up for them (MDA, timing or DME/GPS to the MAP), or execute the missed approach if unsure. Tell ATC.",
 "14 CFR 91.187; TPP (inoperative components); IR ACS VI.B",[]],
["VIB","IR.VI.B.K2","nav","How sensitive is the localizer compared to a VOR?",
 "The localizer is about four times more sensitive than a VOR. Its total course width is 3° to 6° (so roughly 1.5°–3° each side for full-scale deflection), tailored to be 700 ft wide at the threshold, compared with 10° each side for a VOR. The glide slope full scale is about 0.7° above or below the path (1.4° total).",
 "AIM 1-1-9; FAA-H-8083-15 ch. 9",[]],
["VIB","IR.VI.B.K1","appr","What's the difference between DA and MDA, and when do you go missed on an ILS?",
 "DA (decision altitude) is where you must decide to continue or go missed on an approach with vertical guidance; a slight momentary dip below during the transition to the missed is acceptable. MDA is the lowest you may descend to on a non-precision approach and you level off. Go missed at the DA if the 91.175(c) requirements aren't met.",
 "14 CFR 91.175(c), (e); AIM 5-4-5",[]],
["VIB","IR.VI.B.K1","appr","The approach lights are out of service. How does that affect minimums?",
 "Check the TPP inoperative components table and the procedure notes. Visibility minimums are usually increased (e.g., by 1/4 SM for many ALS outages), unless the chart says the table doesn't apply.",
 "TPP Inoperative Components or Visual Aids Table; FDC NOTAMs",[]],
["VIB","IR.VI.B.K3","nav","Explain RVR. What's RVR 2400 and 1600 in statute miles?",
 "Runway visual range is the measured horizontal distance a pilot can see down the runway, in feet. RVR 2400 ≈ 1/2 SM; RVR 1600 ≈ 1/4 SM; RVR 4000 ≈ 3/4 SM; RVR 5000 ≈ 1 SM.",
 "TPP RVR/meteorological visibility comparable values table; AIM 7-1",[]],
// ===== VI.C Missed approach =====
["VIC","IR.VI.C.K1","appr","When must you execute the missed approach?",
 "Immediately when below the MDA or at the MAP/DA and the 91.175(c) requirements aren't met, or whenever an identifiable part of the airport isn't distinctly visible during a circling maneuver at or above the MDA (unless the inability is due only to normal bank in the circling maneuver).",
 "14 CFR 91.175(e)",
 [["You decide to go missed 2 miles before the MAP. What do you fly?","Unless ATC says otherwise, fly the approach course to the MAP, then follow the published missed approach. Climb immediately, but don't turn early.","AIM ch. 5 sec. 4 (Missed approach); Instrument Procedures Handbook"]]],
["VIC","IR.VI.C.K1","appr","You go missed from a circling approach. How do you get to the missed approach course?",
 "Make an initial climbing turn toward the landing runway, then maneuver to intercept and follow the published missed approach course. The protected area is built around the runways, so stay within it.",
 "AIM ch. 5 sec. 4 (Missed approach); Instrument Procedures Handbook ch. 4",[]],
["VIC","IR.VI.C.K1","appr","Missed approach in actual IMC: what are your actions and calls?",
 "Power up, pitch for climb, positive rate then gear/flaps per POH, follow the missed approach instructions (heading and altitude first), switch nav source if needed, then tell ATC 'missed approach' and request a second approach or proceed to the alternate.",
 "14 CFR 91.183; AIM ch. 5 sec. 3 (reports); POH",[]],
["VIC","IR.VI.C.K1","appr","What climb gradient does a missed approach assume?",
 "200 ft/NM unless a higher gradient is published in the missed approach (then the minimums may be higher without it). Check you can meet any published missed approach climb gradient.",
 "Instrument Procedures Handbook ch. 4; TPP notes",[]],
// ===== VI.D Circling =====
["VID","IR.VI.D.K1","appr","How do approach categories work and what category is a Cessna 172?",
 "Based on VREF, or 1.3 × VSO at maximum landing weight if no VREF: A under 91 kt, B 91–120, C 121–140, D 141–165, E 166 or more. A 172 is Category A. But if you fly the approach faster than your category's speed range, use the higher category's minimums.",
 "14 CFR 97.3 (aircraft approach category); AIM 5-4-7",
 [["Why does it matter on a circling approach?","Category determines the circling protected area radius and the circling MDA/visibility. Newer procedures (a white C on a black box) use larger 'expanded' radii that depend on the circling MDA.","Instrument Procedures Handbook ch. 4; TPP legend"]]],
["VID","IR.VI.D.K1","appr","You're circling at the MDA at night to the opposite runway. What are the risks and techniques?",
 "Losing sight of the runway, descending prematurely, overbanking, flying outside the protected area, and black-hole illusions. Stay at the MDA until in a position to make a normal descent, keep the runway in sight, avoid more than ~30° bank, and if you lose sight of the airport, go missed immediately.",
 "14 CFR 91.175(c), (e)(2); AIM ch. 5 sec. 4",[]],
